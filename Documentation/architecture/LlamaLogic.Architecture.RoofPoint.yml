  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Represents a lot-local tile position of a <xref href="LlamaLogic.Architecture.Roof" data-throw-if-not-resolved="false"></xref>'s footprint
  remarks: >-
    From version 10 of <xref href="LlamaLogic.Architecture.RoofsSection" data-throw-if-not-resolved="false"></xref> on, each point is stored as a 32-bit value: <xref href="LlamaLogic.Architecture.RoofPoint.X" data-throw-if-not-resolved="false"></xref> in the low byte, then <xref href="LlamaLogic.Architecture.RoofPoint.Z" data-throw-if-not-resolved="false"></xref>, then <xref href="LlamaLogic.Architecture.RoofPoint.Level" data-throw-if-not-resolved="false"></xref>, then <xref href="LlamaLogic.Architecture.RoofPoint.Reserved" data-throw-if-not-resolved="false"></xref> in the high byte.

    Before version 10, a point is stored as its three low bytes.
