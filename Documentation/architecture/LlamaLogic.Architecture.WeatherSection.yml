  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.Weather\" data-throw-if-not-resolved=\"false\"></xref> section: the lot's seasonal weather interpolation value (\U0001F513)"
  remarks: >-
    <xref href="LlamaLogic.Architecture.WeatherSection.Value" data-throw-if-not-resolved="false"></xref> is the value of the game's <code>request_season_weather_interpolation</code> Python function for interpolation type 1; which weather quantity that is has not been established.

    It is 0 in 2,087 of the 2,102 sections examined and up to about 0.86 in the rest.

    Version 1 is the only one.
