  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.FloorKeys\" data-throw-if-not-resolved=\"false\"></xref> section: the floor pattern keys the floor id grids refer to by id (\U0001F513)"
  remarks: >-
    <p>Every nonzero id in a <xref href="LlamaLogic.Architecture.FloorIdGridSection" data-throw-if-not-resolved="false"></xref> is the <xref href="LlamaLogic.Architecture.FloorKeyEntry.Id" data-throw-if-not-resolved="false"></xref> of one of <xref href="LlamaLogic.Architecture.FloorKeysSection.Entries" data-throw-if-not-resolved="false"></xref>.

    The game returns <xref href="LlamaLogic.Architecture.FloorKeysSection.DefaultKey" data-throw-if-not-resolved="false"></xref> for id 0 or an id with no entry, allocates a new entry the smallest unused id of 1 or more, and frees an entry when its <xref href="LlamaLogic.Architecture.FloorKeyEntry.ReferenceCount" data-throw-if-not-resolved="false"></xref> drops to 0.</p>

    <p>The layout follows the game's reader and writer. The section has no version.</p>
  example: []
  syntax:
    content: 'public sealed class FloorKeysSection : LotArchitectureSection'
    content.vb: Public NotInheritable Class FloorKeysSection Inherits LotArchitectureSection
