  namespace: LlamaLogic.Architecture
  summary: Represents one of the two user records of a <xref href="LlamaLogic.Architecture.LotInfoSection" data-throw-if-not-resolved="false"></xref>
  remarks: >-
    <p>The names are account names in the lots examined (or empty); that the first record is the lot's creator and the second its last modifier is a hypothesis.</p>

    <p>The section stores both <xref href="LlamaLogic.Architecture.LotInfoUser.Id" data-throw-if-not-resolved="false"></xref> values and both <xref href="LlamaLogic.Architecture.LotInfoUser.Name" data-throw-if-not-resolved="false"></xref> values first; from version 19 on, each record's <xref href="LlamaLogic.Architecture.LotInfoUser.Unknown1" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.LotInfoUser.Unknown2" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.LotInfoUser.RepeatedId" data-throw-if-not-resolved="false"></xref> follow.</p>
