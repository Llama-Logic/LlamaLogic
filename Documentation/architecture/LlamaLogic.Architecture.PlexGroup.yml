  summary: Represents a group of the <xref href="LlamaLogic.Architecture.PlexGroupsSection" data-throw-if-not-resolved="false"></xref>
  remarks: >-
    <p>The layout follows the game's reader and writer.</p>

    <p>Layout: a <xref href="System.UInt16" data-throw-if-not-resolved="false"></xref> group version (the game writes 1 and fails to load the lot when it is 0; 1 in every lot examined, the only one supported), <xref href="LlamaLogic.Architecture.PlexGroup.Id" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.PlexGroup.Unknown1" data-throw-if-not-resolved="false"></xref>, a <xref href="System.UInt16" data-throw-if-not-resolved="false"></xref> count, then the <xref href="LlamaLogic.Architecture.PlexGroup.Values" data-throw-if-not-resolved="false"></xref>.</p>
