  summary: Gets the values of the group
  remarks: >-
    Hypothesis: block ids. They are strictly ascending, 0 through 307, in the lots examined.

    469 of the 736 groups examined are empty; of the 3,522 values of the other 267, 3,271 are ids of blocks of the bundle's <xref href="LlamaLogic.Architecture.WallBlocksSection" data-throw-if-not-resolved="false"></xref>, and in 21 of those groups every value is.
