  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Represents a plex (a unit of a multi-unit lot) of the <xref href="LlamaLogic.Architecture.PlexesSection" data-throw-if-not-resolved="false"></xref>, with the blocks that make up its outline
  remarks: >-
    <p>The layout follows the game's reader and writer.</p>

    <p>Layout, with gates on the section's version: <xref href="LlamaLogic.Architecture.Plex.Id" data-throw-if-not-resolved="false"></xref> (<xref href="System.UInt16" data-throw-if-not-resolved="false"></xref>), the offset within the section at which the plex ends (<xref href="System.UInt32" data-throw-if-not-resolved="false"></xref>, from version 2 on), <xref href="LlamaLogic.Architecture.Plex.IsVisible" data-throw-if-not-resolved="false"></xref> (<xref href="System.UInt32" data-throw-if-not-resolved="false"></xref>), a <xref href="System.UInt32" data-throw-if-not-resolved="false"></xref> block count, the <xref href="LlamaLogic.Architecture.Plex.Blocks" data-throw-if-not-resolved="false"></xref>,

    <xref href="LlamaLogic.Architecture.Plex.Unknown1" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.Plex.Unknown2" data-throw-if-not-resolved="false"></xref> (after 4), the name (version 6: a <xref href="System.UInt32" data-throw-if-not-resolved="false"></xref> byte count and ASCII text), then after 5 <xref href="LlamaLogic.Architecture.Plex.TileCount" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.Plex.Unknown3" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.Plex.Unknown4" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.Plex.Unknown5" data-throw-if-not-resolved="false"></xref>.

    The game writes the end offset as a placeholder and patches it, so that its reader can skip the plex; the offset is not a property, it is checked on reading and computed on writing.</p>
  example: []
  syntax:
    content: public sealed class Plex
    content.vb: Public NotInheritable Class Plex
