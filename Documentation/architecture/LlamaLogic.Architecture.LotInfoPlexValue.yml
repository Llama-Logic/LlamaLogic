  summary: Gets/sets whether the entry has a value
  remarks: >-
    The game writes <xref href="LlamaLogic.Architecture.LotInfoPlexValue.Value" data-throw-if-not-resolved="false"></xref> even when this is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.

    It is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> in all but five of the entries examined.
