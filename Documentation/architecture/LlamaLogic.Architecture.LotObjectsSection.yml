  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.LotObjects\" data-throw-if-not-resolved=\"false\"></xref> section: the objects of the lot, as an <code>EA.Sims4.Network.LotObjectList</code> message (\U0001F513)"
  remarks: >-
    <p>Version 1 is the only one; the game fails to load the lot with any other.

    The version is followed by the 32-bit length of the serialized message.

    The game writes the section only when the list is not empty.</p>

    <p>Re-serializing the message reproduces every payload examined byte for byte.</p>
