  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.PlexGroups\" data-throw-if-not-resolved=\"false\"></xref> section: groups of values the <xref href=\"LlamaLogic.Architecture.PlexesSection\" data-throw-if-not-resolved=\"false\"></xref> refers to by id (\U0001F513)"
  remarks: >-
    <p>The layout follows the game's reader and writer; the game reads the section only when the <xref href="LlamaLogic.Architecture.LotInfoSection" data-throw-if-not-resolved="false"></xref> is version 20 or later, and after loading forwards the groups to a global service. What the groups mean is unknown; that their values are block ids is a hypothesis (see <xref href="LlamaLogic.Architecture.PlexGroup.Values" data-throw-if-not-resolved="false"></xref>).</p>

    <p>Version 1 is the only one supported; the game writes it, and the lots examined hold only it. The game reads nothing more from a section of version 0, and the layout of every other version as that of version 1.</p>

    <p>Layout: the version (<xref href="System.UInt32" data-throw-if-not-resolved="false"></xref>), a <xref href="System.UInt16" data-throw-if-not-resolved="false"></xref> count, then the <xref href="LlamaLogic.Architecture.PlexGroupsSection.Groups" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: 'public sealed class PlexGroupsSection : LotArchitectureSection'
    content.vb: Public NotInheritable Class PlexGroupsSection Inherits LotArchitectureSection
