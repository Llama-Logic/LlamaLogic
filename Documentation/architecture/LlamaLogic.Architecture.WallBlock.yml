  summary: Gets/sets the elevation of the block's base, in meters
  remarks: >-
    The game sets it to the elevation of <xref href="LlamaLogic.Architecture.WallBlock.Level" data-throw-if-not-resolved="false"></xref> plus the lot's offset; adding a foundation raised it by 0.25 (in-game test).

