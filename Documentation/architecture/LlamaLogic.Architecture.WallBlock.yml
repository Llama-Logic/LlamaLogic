    startLine: 147
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets the catalog keys that versions before 27 store for the whole block
  remarks: >-
    <p>Versions before 21 store 15 keys, versions 21 through 26 store 9.

    Of 15, the game uses positions 1, 2 and 5 for slots 0, 1 and 2, positions 3 and 4 for slot 7 (the later one wins), position 8 for slot 3 and positions 12 through 14 for slots 4 through 6; of 9, it uses positions 6 through 8 for slots 4 through 6.

    It reads the other positions as four <xref href="System.UInt32" data-throw-if-not-resolved="false"></xref> values and discards them; in the lots examined they hold floor, window set and object catalog keys or the null key.</p>
  example: []
