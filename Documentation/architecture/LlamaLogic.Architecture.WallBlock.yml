    startLine: 128
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets whether the block has a floor
  remarks: >-
    Deleting the entire floor of a room changed only this value of the room's block, from <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> (in-game test).

    The game keeps it at offset 0x80 of the block, sets it to whether the level is at most 0 when it copies blocks into a plex and needs it for <xref href="LlamaLogic.Architecture.WallBlock.FloorHeightOffset" data-throw-if-not-resolved="false"></xref>.

    In the lots examined it is 1 for every pool and fountain block, for 36,076 of the 51,425 <xref href="LlamaLogic.Architecture.WallBlockType.Standard" data-throw-if-not-resolved="false"></xref> blocks and for 5,271 of the 11,629 <xref href="LlamaLogic.Architecture.WallBlockType.Fence" data-throw-if-not-resolved="false"></xref> blocks.
  example: []
