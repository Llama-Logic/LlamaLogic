  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: 'Represents a block: a room, platform, wall line, fence line, pool or fountain, as loops of segments on one level, with the catalog products along them'
  remarks: >-
    <p>This is the game's WallInfo, which <xref href="LlamaLogic.Architecture.WallBlocksSection" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.PlexesSection" data-throw-if-not-resolved="false"></xref> both store; the layout follows the game's reader and writer.

    Versions 17 through 36 are supported, and the game writes version 36. The game reads versions 18 through 36; in the lots examined, version 17 appears only where the <xref href="LlamaLogic.Architecture.LotSizeSection" data-throw-if-not-resolved="false"></xref> is version 2, and its layout is the game's layout for version 18 plus <xref href="LlamaLogic.Architecture.WallBlock.Unknown1" data-throw-if-not-resolved="false"></xref>.

    The lots examined hold versions 17, 22, 29, 31, 32, 33, 35 and 36; the layouts of the other versions follow the game's reader.</p>

    <p>Layout, with version gates: <xref href="LlamaLogic.Architecture.WallBlock.Version" data-throw-if-not-resolved="false"></xref> (<xref href="System.UInt16" data-throw-if-not-resolved="false"></xref>), <xref href="LlamaLogic.Architecture.WallBlock.Id" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.WallBlock.Level" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.WallBlock.Unknown1" data-throw-if-not-resolved="false"></xref> (17), <xref href="LlamaLogic.Architecture.WallBlock.BlockType" data-throw-if-not-resolved="false"></xref> (after 24), <xref href="LlamaLogic.Architecture.WallBlock.PlexId" data-throw-if-not-resolved="false"></xref> (after 35), <xref href="LlamaLogic.Architecture.WallBlock.HasFloor" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.WallBlock.Unknown3" data-throw-if-not-resolved="false"></xref> (after 27), <xref href="LlamaLogic.Architecture.WallBlock.BaseElevation" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.WallBlock.FloorHeightOffset" data-throw-if-not-resolved="false"></xref> (after 33), <xref href="LlamaLogic.Architecture.WallBlock.Unknown4" data-throw-if-not-resolved="false"></xref> (31 and 32),

    then before 27: <xref href="LlamaLogic.Architecture.WallBlock.Unknown5" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.WallBlock.Unknown6" data-throw-if-not-resolved="false"></xref> (before 22), <xref href="LlamaLogic.Architecture.WallBlock.LegacyKeys" data-throw-if-not-resolved="false"></xref> (type, group, instance), <xref href="LlamaLogic.Architecture.WallBlock.Unknown7" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.WallBlock.Unknown8" data-throw-if-not-resolved="false"></xref>;

    then a <xref href="System.UInt16" data-throw-if-not-resolved="false"></xref> loop count (after 23; one loop before), the <xref href="LlamaLogic.Architecture.WallBlock.Loops" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.WallBlock.Unknown9" data-throw-if-not-resolved="false"></xref> (before 19), <xref href="LlamaLogic.Architecture.WallBlock.Products" data-throw-if-not-resolved="false"></xref> (after 19), <xref href="LlamaLogic.Architecture.WallBlock.LegacyStamp" data-throw-if-not-resolved="false"></xref> (12 through 25), and before 27 <xref href="LlamaLogic.Architecture.WallBlock.Unknown10" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.WallBlock.Unknown11" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.WallBlock.Unknown12" data-throw-if-not-resolved="false"></xref>.</p>

    <p>Each segment stores these product slots: none before version 20 (the game takes all from <xref href="LlamaLogic.Architecture.WallBlock.LegacyKeys" data-throw-if-not-resolved="false"></xref>), slots 0 through 3 in versions 20 through 26 (the game takes slots 4 through 8 from <xref href="LlamaLogic.Architecture.WallBlock.LegacyKeys" data-throw-if-not-resolved="false"></xref>), 0 through 6 in versions 27 and 28, 0 through 7 in versions 29 and 32 through 34, and all nine in versions 30, 31, 35 and 36.</p>
