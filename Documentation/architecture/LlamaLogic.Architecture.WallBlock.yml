  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the offset of the floor from <xref href="LlamaLogic.Architecture.WallBlock.BaseElevation" data-throw-if-not-resolved="false"></xref>, in meters
  remarks: >-
    The game checks it with FloorHeightOffsetOutOfBounds before setting it and takes the block's bottom as the lower of <xref href="LlamaLogic.Architecture.WallBlock.BaseElevation" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.WallBlock.BaseElevation" data-throw-if-not-resolved="false"></xref> plus this offset.

    Raising a room's floor one step changed it from 0 to 0.25, and a platform had 0.25 when drawn and 0.5 after one raise (in-game tests); the game stores a platform as a block like a room, so a raised room floor and a platform differ in the data only by their segments, which are <xref href="LlamaLogic.Architecture.WallBlockSegmentKind.Open" data-throw-if-not-resolved="false"></xref> where a platform has no walls.

    Stored from version 34 on.
  example: []
  syntax:
    content: public float FloorHeightOffset { get; set; }
    parameters: []
    return:
      type: System.Single
    content.vb: Public Property FloorHeightOffset As Single
  overload: LlamaLogic.Architecture.WallBlock.FloorHeightOffset*
