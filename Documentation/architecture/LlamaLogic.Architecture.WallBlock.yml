    id: Unknown3
    path: ../LlamaLogic.Architecture/Sections/WallBlock.cs
    startLine: 208
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets a Boolean the game keeps at offset 0x81 of the block
  remarks: >-
    Hypothesis: whether the block has an automatic ceiling. The game sets it to whether every outer segment has a wall or the level is below 0, and clears it when it copies blocks into a plex.

    In the lots examined it is 0 for every <xref href="LlamaLogic.Architecture.WallBlockType.Fence" data-throw-if-not-resolved="false"></xref> block, 1 for every fountain block, 1 for 466 of the 482 pool blocks and for 22,161 of the 51,182 <xref href="LlamaLogic.Architecture.WallBlockType.Standard" data-throw-if-not-resolved="false"></xref> blocks that store it.

    In in-game tests a new fence block and a platform had 0 and enclosed rooms had 1, which is consistent with the hypothesis.

    Stored from version 28 on.
  example: []
  syntax:
    content: public bool Unknown3 { get; set; }
    parameters: []
