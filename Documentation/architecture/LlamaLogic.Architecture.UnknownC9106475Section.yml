  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.UnknownC9106475\" data-throw-if-not-resolved=\"false\"></xref> section: a list of entries, each holding levels with keys, whose meaning has not been established (\U0001F513)"
  remarks: >-
    <p>Versions 1 through 3 are supported, and the game writes version 3 (the game's reader accepts any version up to 3; the lower bound is a choice).

    Each level of an entry holds six keys from version 3, three before.

    The game discards the data after loading unless a flag is set.</p>

    <p>Every lot examined holds version 3 with no entries, so the layout of the entries follows the game's reader and has not been observed.</p>
  example: []
