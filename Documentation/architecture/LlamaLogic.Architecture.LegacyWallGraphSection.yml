    startLine: 12
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.LegacyWallGraph\" data-throw-if-not-resolved=\"false\"></xref> section: a graph of wall edges with their wall patterns and products, found only in older world files (\U0001F513)"
  remarks: >-
    <p>No code in the game's simulation library reads or writes this section (other parts of the game were not examined), so the layout comes from the lots examined and every meaning is a hypothesis.

    The lots examined hold 21 of these sections, all in world files; 17 are empty.

    The two tables have the shape of the game's <xref href="LlamaLogic.Architecture.ProductTable" data-throw-if-not-resolved="false"></xref>, and in each of the four non-empty sections examined every id is referenced and every <xref href="LlamaLogic.Architecture.ProductTableEntry.ReferenceCount" data-throw-if-not-resolved="false"></xref> equals the number of references in the section.</p>

    <p>Version 1 is the only one supported, and the only one in the lots examined.</p>

    <p>Layout: the version (<xref href="System.UInt32" data-throw-if-not-resolved="false"></xref>), the <xref href="LlamaLogic.Architecture.LegacyWallGraphSection.Products" data-throw-if-not-resolved="false"></xref> table, the <xref href="LlamaLogic.Architecture.LegacyWallGraphSection.WallPatterns" data-throw-if-not-resolved="false"></xref> table, then three lists, each an <xref href="System.Int32" data-throw-if-not-resolved="false"></xref> count and its entries: <xref href="LlamaLogic.Architecture.LegacyWallGraphSection.Edges" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.LegacyWallGraphSection.ProductEdges1" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.LegacyWallGraphSection.ProductEdges2" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: 'public sealed class LegacyWallGraphSection : LotArchitectureSection'
    content.vb: Public NotInheritable Class LegacyWallGraphSection Inherits LotArchitectureSection
