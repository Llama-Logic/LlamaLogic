  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets the water level of a quarter of a tile, in steps of 0.25 m
  remarks: >-
    −400 (the game's default) means no water, and the value is −400 almost everywhere.

    The game multiplies it by 0.25 and uses the result minus the floor or terrain height as a water depth.

    In the lots examined it differs from −400 on every quarter of every pond and then equals the pond's <xref href="LlamaLogic.Architecture.Pond.WaterLevel" data-throw-if-not-resolved="false"></xref>; raising a pond's water level one step in game changed it from −3 to −2 on every quarter of the pond together with <xref href="LlamaLogic.Architecture.Pond.WaterLevel" data-throw-if-not-resolved="false"></xref> (in-game test).
  example: []
  syntax:
    content: public int GetWaterLevel(int x, int z, FloorQuarter quarter)
    parameters:
    - id: x
      type: System.Int32
      description: The tile's index along the lot's local X axis
    - id: z
      type: System.Int32
      description: The tile's index along the lot's local Z axis
    - id: quarter
      type: LlamaLogic.Architecture.FloorQuarter
      description: The quarter of the tile
    return:
      type: System.Int32
    content.vb: Public Function GetWaterLevel(x As Integer, z As Integer, quarter As FloorQuarter) As Integer
  overload: LlamaLogic.Architecture.TerrainHeightsSection.GetWaterLevel*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: <xref href="LlamaLogic.Architecture.TerrainHeightsSection.HasWaterLevels" data-throw-if-not-resolved="false"></xref> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: A coordinate is outside the grid, or <code class="paramref">quarter</code> is not a <xref href="LlamaLogic.Architecture.FloorQuarter" data-throw-if-not-resolved="false"></xref>
  nameWithType.vb: TerrainHeightsSection.GetWaterLevel(Integer, Integer, FloorQuarter)
