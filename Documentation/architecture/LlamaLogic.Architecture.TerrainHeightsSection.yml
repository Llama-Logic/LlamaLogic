  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.TerrainHeights\" data-throw-if-not-resolved=\"false\"></xref> section: the lot's terrain height grid, a second vertex grid of unknown role and a water level per tile quarter (\U0001F513)"
  remarks: >-
    <p>The layout depends on the lot's <xref href="LlamaLogic.Architecture.LotSizeSection.Version" data-throw-if-not-resolved="false"></xref>; the section has no version of its own.

    First come <xref href="LlamaLogic.Architecture.TerrainHeightsSection.VertexGridCount" data-throw-if-not-resolved="false"></xref> grids of (<xref href="LlamaLogic.Architecture.TerrainHeightsSection.SizeX" data-throw-if-not-resolved="false"></xref> + 1) × (<xref href="LlamaLogic.Architecture.TerrainHeightsSection.SizeZ" data-throw-if-not-resolved="false"></xref> + 1) 32-bit floats, one per tile corner, stored as <xref href="LlamaLogic.Architecture.TerrainHeightsSection.SizeX" data-throw-if-not-resolved="false"></xref> + 1 rows of <xref href="LlamaLogic.Architecture.TerrainHeightsSection.SizeZ" data-throw-if-not-resolved="false"></xref> + 1 values.

    Then, when <xref href="LlamaLogic.Architecture.TerrainHeightsSection.HasWaterLevels" data-throw-if-not-resolved="false"></xref>, four 32-bit integers per tile, one per <xref href="LlamaLogic.Architecture.FloorQuarter" data-throw-if-not-resolved="false"></xref>, the tiles stored as <xref href="LlamaLogic.Architecture.TerrainHeightsSection.SizeX" data-throw-if-not-resolved="false"></xref> rows of <xref href="LlamaLogic.Architecture.TerrainHeightsSection.SizeZ" data-throw-if-not-resolved="false"></xref>.</p>

    <p>When the lot's <xref href="LlamaLogic.Architecture.LotSizeSection.Version" data-throw-if-not-resolved="false"></xref> is less than 10 there is one vertex grid per level, indexed by level − <xref href="LlamaLogic.Architecture.LotInfoSection.LowestLevel" data-throw-if-not-resolved="false"></xref>, and the game skips all but the ground level's grid, which holds the terrain height.

    From version 10 there are two: grid 0 is the terrain height (the game's terrain height getter and setter use it, and in-game tests show that sculpting the terrain changes only this grid) and grid 1 is a second per-corner grid whose role is unknown; in-game tests with the raise, flatten and smooth tools changed only grid 0 and left grid 1 unchanged.

    The water levels are present from version 12; before it the game fills them with −400, which means no water.</p>
