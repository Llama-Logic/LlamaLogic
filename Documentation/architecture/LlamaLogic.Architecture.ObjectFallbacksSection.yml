  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.ObjectFallbacks\" data-throw-if-not-resolved=\"false\"></xref> section: the game's object fallback data, four sets of object ids (\U0001F513)"
  remarks: >-
    <p>The game hands this data to its "Object Fallback Manager", the target of a Python function of that name.

    Version 2 is the only one supported: a byte followed by four categories, each a 32-bit count and that many object ids.

    Version 1 stores the data as an <code>ObjectFallbackDataList</code> message instead; no lot examined has it, so it is rejected.</p>

    <p>The game reads exactly four categories whatever <xref href="LlamaLogic.Architecture.ObjectFallbacksSection.Unknown1" data-throw-if-not-resolved="false"></xref> says, and loads each id other than 0 into a set, so the order of the ids on disk is the order of the game's hash set and means nothing.

    The meaning of the categories has not been established.

    In the lots examined <xref href="LlamaLogic.Architecture.ObjectFallbacksSection.Unknown1" data-throw-if-not-resolved="false"></xref> is 4, and each section has two or three ids, all in the second category.</p>
  example: []
  syntax:
    content: 'public sealed class ObjectFallbacksSection : LotArchitectureSection'
    content.vb: Public NotInheritable Class ObjectFallbacksSection Inherits LotArchitectureSection
