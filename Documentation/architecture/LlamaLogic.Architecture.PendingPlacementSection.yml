  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.PendingPlacement\" data-throw-if-not-resolved=\"false\"></xref> section: a footprint the game places on the lot after loading (\U0001F513)"
  remarks: >-
    <p>When <xref href="LlamaLogic.Architecture.PendingPlacementSection.State" data-throw-if-not-resolved="false"></xref> is 1, the game centers a footprint of <xref href="LlamaLogic.Architecture.PendingPlacementSection.Width" data-throw-if-not-resolved="false"></xref> by <xref href="LlamaLogic.Architecture.PendingPlacementSection.Depth" data-throw-if-not-resolved="false"></xref> tiles, turned by <xref href="LlamaLogic.Architecture.PendingPlacementSection.Rotation" data-throw-if-not-resolved="false"></xref>, on the lot and builds a placement operation with <xref href="LlamaLogic.Architecture.LotInfoSection.BlueprintInstance" data-throw-if-not-resolved="false"></xref>; that this places a pending lot template or blueprint is a hypothesis.

    Every lot examined holds the defaults (state 0).</p>

    <p>The layout is <xref href="LlamaLogic.Architecture.PendingPlacementSection.Width" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.PendingPlacementSection.Depth" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.PendingPlacementSection.Rotation" data-throw-if-not-resolved="false"></xref> (from version 3 on), <xref href="LlamaLogic.Architecture.PendingPlacementSection.State" data-throw-if-not-resolved="false"></xref> (a Boolean in version 1), then from version 2 on <xref href="LlamaLogic.Architecture.PendingPlacementSection.Unknown1" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.PendingPlacementSection.Unknown2" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.PendingPlacementSection.Unknown3" data-throw-if-not-resolved="false"></xref> (from version 4 on) and <xref href="LlamaLogic.Architecture.PendingPlacementSection.Unknown4" data-throw-if-not-resolved="false"></xref> (from version 5 on).

    The game reads this section only when <xref href="LlamaLogic.Architecture.LotInfoSection.Version" data-throw-if-not-resolved="false"></xref> is 9 or later.</p>

    <p>Versions 1 through 5 are supported, and the game writes version 5.</p>
  example: []
  syntax:
    content: 'public sealed class PendingPlacementSection : LotArchitectureSection'
    content.vb: Public NotInheritable Class PendingPlacementSection Inherits LotArchitectureSection
