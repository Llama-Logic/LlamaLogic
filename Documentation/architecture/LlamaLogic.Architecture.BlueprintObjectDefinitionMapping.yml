  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents a pair of object definition ids stored in a <xref href=\"LlamaLogic.Architecture.Blueprint\" data-throw-if-not-resolved=\"false\"></xref> (\U0001F513)"
  remarks: >-
    In every blueprint observed, <xref href="LlamaLogic.Architecture.BlueprintObjectDefinitionMapping.From" data-throw-if-not-resolved="false"></xref> is the object definition id of one of the blueprint's <xref href="LlamaLogic.Architecture.Blueprint.LotObjects" data-throw-if-not-resolved="false"></xref>, and <xref href="LlamaLogic.Architecture.BlueprintObjectDefinitionMapping.To" data-throw-if-not-resolved="false"></xref> usually is not.

    Hypothesis: <xref href="LlamaLogic.Architecture.BlueprintObjectDefinitionMapping.To" data-throw-if-not-resolved="false"></xref> is the object definition the game substitutes when <xref href="LlamaLogic.Architecture.BlueprintObjectDefinitionMapping.From" data-throw-if-not-resolved="false"></xref> is unavailable (Sims 4 Studio calls these object fallbacks).
