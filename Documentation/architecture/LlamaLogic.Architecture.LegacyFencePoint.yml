  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the second value of the entry
  remarks: >-
    A whole number in the lots examined. Hypothesis: a coordinate.

    In each of the 252 entries examined in lots that also hold a <xref href="LlamaLogic.Architecture.LegacyWallGraphSection" data-throw-if-not-resolved="false"></xref>, it, <xref href="LlamaLogic.Architecture.LegacyFencePoint.Unknown3" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.LegacyFencePoint.Unknown1" data-throw-if-not-resolved="false"></xref> equal bits 7 through 13, bits 0 through 6 and bits 28 through 31 of a <xref href="LlamaLogic.Architecture.LegacyWallGraphEdge.Code" data-throw-if-not-resolved="false"></xref> or <xref href="LlamaLogic.Architecture.LegacyWallGraphProductEdge.Code" data-throw-if-not-resolved="false"></xref> of that section (or bits 21 through 27, bits 14 through 20 and bits 28 through 31); the other 80 entries are in lots without that section.
  example: []
  syntax:
    content: public float Unknown2 { get; set; }
    parameters: []
    return:
      type: System.Single
    content.vb: Public Property Unknown2 As Single
  overload: LlamaLogic.Architecture.LegacyFencePoint.Unknown2*
