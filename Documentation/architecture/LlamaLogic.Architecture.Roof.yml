  namespace: LlamaLogic.Architecture
  summary: Gets/sets the key of the roof, a <code>CTProductRoof</code> (0x91EDBD3E), which decides its shape
  remarks: >-
    In-game tests show that the shape is this product alone: replacing one shape with another changed only this key and the per-side bytes <xref href="LlamaLogic.Architecture.Roof.Unknown5" data-throw-if-not-resolved="false"></xref> through <xref href="LlamaLogic.Architecture.Roof.Unknown8" data-throw-if-not-resolved="false"></xref>.

    The instances seen are 0x144D (gable), 0x1B03 (half gable), 0x144F (hip), 0x29DC (half hip), 0x282AD (octagonal), 0x282B8 (cone) and 0x7DD4 (the catalog's diagonal gable).
  example: []
  syntax:
    content: public ResourceKey RoofKey { get; set; }
    parameters: []
    return:
      type: LlamaLogic.Packages.ResourceKey
    content.vb: Public Property RoofKey As ResourceKey
