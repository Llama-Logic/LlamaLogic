    path: ../LlamaLogic.Architecture/Sections/Roof.cs
    startLine: 298
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the first per-side byte
  remarks: >-
    The four per-side bytes are 0 through 12 in the lots examined, and 0 through 3 in roofs of sections before version 13.

    In in-game tests they were 1, 1, 1, 1 for the gable, half gable and diagonal gable roofs and 0, 0, 0, 0 for the hip, half hip, octagonal and cone roofs, and replacing one shape with another changed only these bytes and <xref href="LlamaLogic.Architecture.Roof.RoofKey" data-throw-if-not-resolved="false"></xref>; that they choose gable or eave per side is a hypothesis, and their meaning is not proven.

    Before version 10 and before inner version 2, a single byte is stored, so the four must be equal to be written.
  example: []
  syntax:
    content: public byte Unknown5 { get; set; }
    parameters: []
    return:
      type: System.Byte
    content.vb: Public Property Unknown5 As Byte
  overload: LlamaLogic.Architecture.Roof.Unknown5*
