  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Represents one roof of a <xref href="LlamaLogic.Architecture.RoofsSection" data-throw-if-not-resolved="false"></xref>
  remarks: >-
    <p>From version 10 of the section on, a roof holds an <xref href="LlamaLogic.Architecture.Roof.InnerVersion" data-throw-if-not-resolved="false"></xref>, the bounding box of its footprint, the four corners of its footprint, <xref href="LlamaLogic.Architecture.Roof.Direction" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.Roof.Pitch" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.Roof.Curvature" data-throw-if-not-resolved="false"></xref>, four more floats (inner version 3 and later), <xref href="LlamaLogic.Architecture.Roof.BaseElevation" data-throw-if-not-resolved="false"></xref>, four per-side bytes (one byte copied to all four before inner version 2) and <xref href="LlamaLogic.Architecture.Roof.Flags" data-throw-if-not-resolved="false"></xref>.

    Before version 10, a roof holds only the bounding box (as two three-byte points), <xref href="LlamaLogic.Architecture.Roof.Direction" data-throw-if-not-resolved="false"></xref>, one per-side byte copied to all four, <xref href="LlamaLogic.Architecture.Roof.Curvature" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.Roof.Pitch" data-throw-if-not-resolved="false"></xref> and, in version 9, <xref href="LlamaLogic.Architecture.Roof.BaseElevation" data-throw-if-not-resolved="false"></xref>; the game derives the corners and computes the base elevation of older roofs while loading.</p>

    <p>The game replaces each key whose catalog resource is missing or invalid with the default of its type while loading.</p>
  example: []
  syntax:
    content: public sealed class Roof
    content.vb: Public NotInheritable Class Roof
