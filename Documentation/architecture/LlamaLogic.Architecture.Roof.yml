  source:
    remote:
      path: LlamaLogic.Architecture/Sections/Roof.cs
      branch: main
      repo: https://github.com/Llama-Logic/LlamaLogic.git
    id: InnerVersion
    path: ../LlamaLogic.Architecture/Sections/Roof.cs
    startLine: 210
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the version of the roof's own layout
  remarks: >-
    Present from version 10 of the section on; for older sections it keeps its default, 3, and encoding throws if it is changed.

    The game writes 3 and its reader reads any value, laying out the roof as for 3 when the value is 3 or more; this library supports 0 through 3.

    In the lots examined the roofs of version 11 sections hold 2 and those of version 13 sections 3; no version 10 or 12 section examined holds roofs.

    Inner version 3 holds <xref href="LlamaLogic.Architecture.Roof.Unknown1" data-throw-if-not-resolved="false"></xref> through <xref href="LlamaLogic.Architecture.Roof.Unknown4" data-throw-if-not-resolved="false"></xref>, which encoding a lower inner version requires to keep their defaults; before inner version 2, a single per-side byte is stored and copied to <xref href="LlamaLogic.Architecture.Roof.Unknown5" data-throw-if-not-resolved="false"></xref> through <xref href="LlamaLogic.Architecture.Roof.Unknown8" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public uint InnerVersion { get; set; }
    parameters: []
    return:
      type: System.UInt32
    content.vb: Public Property InnerVersion As UInteger
  overload: LlamaLogic.Architecture.Roof.InnerVersion*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: The inner version is not 0 through 3
