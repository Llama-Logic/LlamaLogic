  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the elevation of the roof's base
  remarks: >-
    Present in version 9 and from version 10 on.

    When it is outside the valid range, the game recomputes it while loading as the elevation of the roof's level plus the lot's <xref href="LlamaLogic.Architecture.LotInfoSection.LevelElevationOffset" data-throw-if-not-resolved="false"></xref> (levels 0 and up) or <xref href="LlamaLogic.Architecture.LotInfoSection.NegativeLevelElevationOffset" data-throw-if-not-resolved="false"></xref> (levels below 0).

    Raising the walls below a roof from 3 m to 5 m changed it from 3 to 5 (in-game test).
  example: []
  syntax:
    content: public float BaseElevation { get; set; }
    parameters: []
    return:
      type: System.Single
    content.vb: Public Property BaseElevation As Single
