  summary: Specifies the kind of a <xref href="LlamaLogic.Architecture.WallBlockSegment" data-throw-if-not-resolved="false"></xref>
  remarks: >-
    The game treats a block as enclosed when none of the segments of its outer loop is <xref href="LlamaLogic.Architecture.WallBlockSegmentKind.Open" data-throw-if-not-resolved="false"></xref> or <xref href="LlamaLogic.Architecture.WallBlockSegmentKind.ModularPiece" data-throw-if-not-resolved="false"></xref>, emits CantPlacePoolUnderWall for a <xref href="LlamaLogic.Architecture.WallBlockSegmentKind.Wall" data-throw-if-not-resolved="false"></xref> segment, and requires <xref href="LlamaLogic.Architecture.WallBlockSegmentKind.ModularPiece" data-throw-if-not-resolved="false"></xref> or <xref href="LlamaLogic.Architecture.WallBlockSegmentKind.ModularPieceWithWall" data-throw-if-not-resolved="false"></xref> on a diagonal segment flanked by 45° segments of the same kind, otherwise InvalidBlockModularPieceConfiguration.

    That such segments form rounded corners is a hypothesis.

    Before block version 27 the game maps the stored values 0 through 3 to 0, 1, 2 and 1 with a table.
  example: []
  syntax:
    content: >-
      [SuppressMessage("Design", "CA1028: Enum Storage should be Int32", Justification = "The game stores the value as a byte.")]

      public enum WallBlockSegmentKind : byte
    content.vb: >-
      <SuppressMessage("Design", "CA1028: Enum Storage should be Int32", Justification:="The game stores the value as a byte.")>

