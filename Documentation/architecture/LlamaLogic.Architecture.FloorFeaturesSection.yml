  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.FloorFeatures\" data-throw-if-not-resolved=\"false\"></xref> section: the floor feature layers (\U0001F513)"
  remarks: >-
    <p>The game's floor feature manager reads and writes the section and exposes it to Python as <code>get_floor_feature</code>, <code>set_floor_feature</code>, <code>has_floor_feature</code>, <code>list_floor_features</code> and <code>scan_floor_features</code>.

    Each layer is stored as its type, the byte length of its payload and the payload; the game skips the payload of a layer type above 2, which this library does not support: a section holding one is kept undecoded.</p>

    <p>Versions 0 and 1 are supported, as the game's reader accepts, and the game writes version 1, the only one in the lots examined.

    The section needs the lot's dimensions.</p>
  example: []
