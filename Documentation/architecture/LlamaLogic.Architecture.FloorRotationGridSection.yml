  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents one of the five floor rotation grids: the rotation of the pattern on each quarter of each tile of a <xref href=\"LlamaLogic.Architecture.FloorIdGridSection\" data-throw-if-not-resolved=\"false\"></xref> (\U0001F513)"
  remarks: >-
    <p>The grid has <xref href="LlamaLogic.Architecture.FloorRotationGridSection.SizeX" data-throw-if-not-resolved="false"></xref> × <xref href="LlamaLogic.Architecture.FloorRotationGridSection.SizeZ" data-throw-if-not-resolved="false"></xref> tiles per layer and one rotation of 0 through 3 per <xref href="LlamaLogic.Architecture.FloorQuarter" data-throw-if-not-resolved="false"></xref>.

    A rotation is the number of 90° clockwise turns of the pattern, as seen in game: rotating one floor tile by 90° changed all four of its quarters from 0 to 1, and so did turning a terrain floor tile 90° clockwise (in-game tests).

    Each grid is paired with a floor id grid: <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.FloorRotations" data-throw-if-not-resolved="false"></xref> with <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.Floors" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.CeilingRotations" data-throw-if-not-resolved="false"></xref> with <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.Ceilings" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.SecondaryFloorRotations" data-throw-if-not-resolved="false"></xref> with <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.SecondaryFloors" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.CeilingPaintRotations" data-throw-if-not-resolved="false"></xref> with <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.CeilingPaints" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.TerrainFloorRotations" data-throw-if-not-resolved="false"></xref> with <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.TerrainFloors" data-throw-if-not-resolved="false"></xref>; <xref href="LlamaLogic.Architecture.FloorIdGridSection" data-throw-if-not-resolved="false"></xref> describes the roles of the id grids and the in-game tests and code that show them.</p>

    <p>All types but <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.TerrainFloorRotations" data-throw-if-not-resolved="false"></xref> have one layer per level of the lot (<xref href="LlamaLogic.Architecture.FloorRotationGridSection.HasLevels" data-throw-if-not-resolved="false"></xref>), indexed by level − <xref href="LlamaLogic.Architecture.LotInfoSection.LowestLevel" data-throw-if-not-resolved="false"></xref>; <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.TerrainFloorRotations" data-throw-if-not-resolved="false"></xref> has a single layer, for ground level.</p>

    <p>The layers are stored one after another, each as <xref href="LlamaLogic.Architecture.FloorRotationGridSection.SizeX" data-throw-if-not-resolved="false"></xref> rows of <xref href="LlamaLogic.Architecture.FloorRotationGridSection.SizeZ" data-throw-if-not-resolved="false"></xref> bytes; each byte holds the four rotations of a tile, two bits each, the <xref href="LlamaLogic.Architecture.FloorQuarter.NegativeZ" data-throw-if-not-resolved="false"></xref> quarter in the lowest bits, as the game's getter and setter read and write them. The section has no version.</p>
  example: []
  syntax:
    content: 'public sealed class FloorRotationGridSection : LotArchitectureSection'
