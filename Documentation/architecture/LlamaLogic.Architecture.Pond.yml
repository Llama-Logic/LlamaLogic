  source:
    remote:
      path: LlamaLogic.Architecture/Sections/Pond.cs
      branch: main
      repo: https://github.com/Llama-Logic/LlamaLogic.git
    id: WaterLevel
    path: ../LlamaLogic.Architecture/Sections/Pond.cs
    startLine: 47
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the pond's water level, in steps of 0.25 m
  remarks: >-
    It equals <xref href="LlamaLogic.Architecture.TerrainHeightsSection.GetWaterLevel(System.Int32%2cSystem.Int32%2cLlamaLogic.Architecture.FloorQuarter)" data-throw-if-not-resolved="false"></xref> on every quarter of the pond, which the game multiplies by 0.25.

    Creating a pond in game set it to −1, and raising the pond's water level one step changed it from −3 to −2 together with the water level of every quarter of the pond in the <xref href="LlamaLogic.Architecture.TerrainHeightsSection" data-throw-if-not-resolved="false"></xref>, while the pond spread to more cells (in-game tests).

    It is −1, −2, −3 or 0 in the lots examined.
  example: []
  syntax:
    content: public int WaterLevel { get; set; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public Property WaterLevel As Integer
  overload: LlamaLogic.Architecture.Pond.WaterLevel*
