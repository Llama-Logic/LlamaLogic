  summary: Gets/sets the tray instance of the blueprint the lot was saved as
  remarks: >-
    Present from version 11 on.

    In-game tests show that it equals the tray instance of each blueprint saved, and it is nonzero in every blueprint examined; the game passes it to the placement operation it builds from the <xref href="LlamaLogic.Architecture.PendingPlacementSection" data-throw-if-not-resolved="false"></xref>.
