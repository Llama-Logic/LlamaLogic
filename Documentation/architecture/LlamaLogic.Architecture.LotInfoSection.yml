  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.LotInfo\" data-throw-if-not-resolved=\"false\"></xref> section: the lot's levels, style, blueprint and users (\U0001F513)"
  remarks: >-
    <p>The layout is <xref href="LlamaLogic.Architecture.LotInfoSection.Unknown1" data-throw-if-not-resolved="false"></xref> (from version 13 on), the lowest and highest levels (signed bytes), one height per level from the lowest to the highest, <xref href="LlamaLogic.Architecture.LotInfoSection.LevelElevationOffset" data-throw-if-not-resolved="false"></xref> (from version 6 on), <xref href="LlamaLogic.Architecture.LotInfoSection.NegativeLevelElevationOffset" data-throw-if-not-resolved="false"></xref> (from version 16 on), <xref href="LlamaLogic.Architecture.LotInfoSection.Unknown2" data-throw-if-not-resolved="false"></xref> (from version 17 on), <xref href="LlamaLogic.Architecture.LotInfoSection.Unknown3" data-throw-if-not-resolved="false"></xref> (from version 18 on) and <xref href="LlamaLogic.Architecture.LotInfoSection.StyleKey" data-throw-if-not-resolved="false"></xref> (from version 7 on).

    From version 11 on, <xref href="LlamaLogic.Architecture.LotInfoSection.BlueprintInstance" data-throw-if-not-resolved="false"></xref>, the ids of the two users, <xref href="LlamaLogic.Architecture.LotInfoSection.Uuid" data-throw-if-not-resolved="false"></xref>, the names of the two users and, from version 19 on, the rest of the two user records follow.

    Versions 12 through 14 end with one plex map entry (value and has-value flag) and versions 15 and later with a 32-bit entry count and the entries.</p>

    <p>The highest level is not kept: it is <xref href="LlamaLogic.Architecture.LotInfoSection.LowestLevel" data-throw-if-not-resolved="false"></xref> plus the number of <xref href="LlamaLogic.Architecture.LotInfoSection.LevelHeights" data-throw-if-not-resolved="false"></xref> minus 1, which the game's reader relies on to read the heights.

    The number of heights equals <xref href="LlamaLogic.Architecture.LotSizeSection.LevelCount" data-throw-if-not-resolved="false"></xref>.</p>

    <p>Versions 5 through 20 are supported, and the game writes version 20.

    The game reads some other sections only for some versions of this one (for example <xref href="LlamaLogic.Architecture.PendingPlacementSection" data-throw-if-not-resolved="false"></xref> from version 9 on).</p>
