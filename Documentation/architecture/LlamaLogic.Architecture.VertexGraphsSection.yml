    path: ../LlamaLogic.Architecture/Sections/VertexGraphsSection.cs
    startLine: 12
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.VertexGraphs\" data-throw-if-not-resolved=\"false\"></xref> section: graphs of vertices and edges, whose version decides the layout of the <xref href=\"LlamaLogic.Architecture.WallEdgesSection\" data-throw-if-not-resolved=\"false\"></xref> (\U0001F513)"
  remarks: >-
    <p>Each graph holds vertices, under the tag "TREV" ("VERT" reversed), and edges, under the tag "TCES". What the graphs describe is not established; Sims 4 Studio calls this section WallCutout.</p>

    <p>In in-game tests the first graph changed whenever walls, roofs, stairs or platforms were added or reshaped (including when a roof was replaced with another shape) and never for paint, trim, terrain or lot type changes; this is an observation only.</p>

    <p>The layout follows the game's writer; on loading, the game reads only the section's version, which decides the layout of the <xref href="LlamaLogic.Architecture.WallEdgesSection" data-throw-if-not-resolved="false"></xref>, and does not read the graphs.

    Versions 5 through 9 are supported, and the game writes version 9; the lots examined hold versions 5 through 9.</p>

    <p>Layout: <xref href="LlamaLogic.Architecture.VertexGraphsSection.Version" data-throw-if-not-resolved="false"></xref>, then the <xref href="LlamaLogic.Architecture.VertexGraphsSection.Graphs" data-throw-if-not-resolved="false"></xref>: three before version 8 and four from version 8 on, the numbers of graph objects the game's reader resets for those versions.</p>
  example: []
  syntax:
    content: 'public sealed class VertexGraphsSection : LotArchitectureSection'
    content.vb: Public NotInheritable Class VertexGraphsSection Inherits LotArchitectureSection
