  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.ModularPieces\" data-throw-if-not-resolved=\"false\"></xref> section: the modular pieces placed on the lot (\U0001F513)"
  remarks: >-
    The layout follows the game's reader.

    Versions 4 through 6 are supported, those in the lots examined, and the game writes version 6.

    <xref href="LlamaLogic.Architecture.ModularPiece.FirstWallPatternKey" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.ModularPiece.SecondWallPatternKey" data-throw-if-not-resolved="false"></xref> exist from version 5, <xref href="LlamaLogic.Architecture.ModularPiece.Unknown3" data-throw-if-not-resolved="false"></xref> from version 6.
  example: []
  syntax:
    content: 'public sealed class ModularPiecesSection : LotArchitectureSection'
