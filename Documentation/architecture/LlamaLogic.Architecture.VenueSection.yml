  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.Venue\" data-throw-if-not-resolved=\"false\"></xref> section: the lot's venue (\U0001F513)"
  remarks: >-
    <p>Versions 3 through 6 are supported, and the game writes version 6.

    <xref href="LlamaLogic.Architecture.VenueSection.BusinessInfos" data-throw-if-not-resolved="false"></xref> exists from version 4, <xref href="LlamaLogic.Architecture.VenueSection.Unknown3" data-throw-if-not-resolved="false"></xref> from version 5 and <xref href="LlamaLogic.Architecture.VenueSection.HouseholdId" data-throw-if-not-resolved="false"></xref> from version 6; <xref href="LlamaLogic.Architecture.VenueSection.Unknown1" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.VenueSection.Unknown2" data-throw-if-not-resolved="false"></xref> exist from versions 2 and 3, so in every supported version.</p>

    <p>In tray and blueprint mode the game keeps only the entry of the current venue, so a record holds none or one entry.</p>
  example: []
  syntax:
    content: 'public sealed class VenueSection : LotArchitectureSection'
    content.vb: Public NotInheritable Class VenueSection Inherits LotArchitectureSection
