    startLine: 102
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the tuning id of the lot's venue
  remarks: >-
    The game treats 0 as its default venue, 0x6FC6.

    Changing the lot type in game from Residential to Generic changed it from 0x6FC6 to 0x18201, and changing it back restored 0x6FC6 (in-game test).

    It is never 0 in the lots examined.
  example: []
  syntax:
    content: public ulong VenueTuning { get; set; }
    parameters: []
    return:
      type: System.UInt64
    content.vb: Public Property VenueTuning As ULong
