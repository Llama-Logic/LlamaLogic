  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the type of the layer, 0 through 2
  remarks: >-
    The game rejects other types as an "Invalid layer type"; the names of the three types are not in the game's code.

    In the lots examined the values of type 0 are 0 or 255, those of type 1 are 0, 127, 128 or 255, and those of type 2 are 0; layers of type 2 have no levels in all but 6 records.
  example: []
  syntax:
    content: public byte Type { get; set; }
    parameters: []
    return:
      type: System.Byte
    content.vb: Public Property Type As Byte
  overload: LlamaLogic.Architecture.FloorFeatureLayer.Type*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: The type is not 0 through 2
