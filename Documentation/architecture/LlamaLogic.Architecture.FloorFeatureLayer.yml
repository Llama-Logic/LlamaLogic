  namespace: LlamaLogic.Architecture
  summary: Gets the levels, in the order they are stored, which is ascending in the lots examined
  remarks: A level of a layer of type 0 or 1 has one value per tile (<xref href="LlamaLogic.Architecture.FloorFeatureLevel.SizeX" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.FloorFeatureLevel.SizeZ" data-throw-if-not-resolved="false"></xref> are the lot's); a level of a layer of type 2 has a single value (both are 1).
