  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the key under which the game maps the entry
  remarks: >-
    Hypothesis: it identifies a wall edge, its bytes packing the level (high nibble of byte 0, signed) and a kind (low nibble), a direction (byte 1: 0, 1, 6 or 7) and two coordinates (bytes 2 and 3).

    About 42% of the keys in the lots examined are also <xref href="LlamaLogic.Architecture.VertexGraphEdge.Id" data-throw-if-not-resolved="false"></xref> values of the bundle's <xref href="LlamaLogic.Architecture.VertexGraphsSection" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public uint MapKey { get; set; }
    parameters: []
    return:
      type: System.UInt32
    content.vb: Public Property MapKey As UInteger
  overload: LlamaLogic.Architecture.WallEdgePatterns.MapKey*
