    id: CeilingRailStamp
    path: ../LlamaLogic.Architecture/Sections/WallBlockSegment.cs
    startLine: 37
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the value the game keeps with the ceiling rail slot
  remarks: >-
    The game returns it with slot 3.

    Adding a foundation set it, together with <xref href="LlamaLogic.Architecture.WallBlockSegment.FenceStamp" data-throw-if-not-resolved="false"></xref>, to the value <xref href="LlamaLogic.Architecture.WallBlocksSection.StampCounter" data-throw-if-not-resolved="false"></xref> was raised to (in-game test); what the game uses it for is unknown.

    It equals <xref href="LlamaLogic.Architecture.WallBlockSegment.FenceStamp" data-throw-if-not-resolved="false"></xref> in 66% of the segments of the <xref href="LlamaLogic.Architecture.WallBlocksSection" data-throw-if-not-resolved="false"></xref> blocks examined and in 81% of those of the <xref href="LlamaLogic.Architecture.PlexesSection" data-throw-if-not-resolved="false"></xref> blocks.

    Stored from version 26 on; older versions store one value for the whole block, <xref href="LlamaLogic.Architecture.WallBlock.LegacyStamp" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public uint CeilingRailStamp { get; set; }
    parameters: []
    return:
      type: System.UInt32
    content.vb: Public Property CeilingRailStamp As UInteger
  overload: LlamaLogic.Architecture.WallBlockSegment.CeilingRailStamp*
