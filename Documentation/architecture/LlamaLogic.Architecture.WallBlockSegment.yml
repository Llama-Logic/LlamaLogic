  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: 'Represents a segment of a <xref href="LlamaLogic.Architecture.WallBlockLoop" data-throw-if-not-resolved="false"></xref>: the run from one point of the loop to the next, with the catalog products along it'
  remarks: >-
    <p>The products are ids into the block's <xref href="LlamaLogic.Architecture.WallBlock.Products" data-throw-if-not-resolved="false"></xref> table (0 for none); every nonzero id in the lots examined is an id of that table.

    The game reads them as nine slots; which slots a block version stores is described with <xref href="LlamaLogic.Architecture.WallBlock.Version" data-throw-if-not-resolved="false"></xref>, and the game fills the slots an older version does not store from the block's <xref href="LlamaLogic.Architecture.WallBlock.LegacyKeys" data-throw-if-not-resolved="false"></xref>.

    The slot names follow the catalog types the slots refer to in every lot examined (names from the game's CTProduct table).</p>

    <p>Layout: the loop stores <xref href="LlamaLogic.Architecture.WallBlockSegment.X" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.WallBlockSegment.Z" data-throw-if-not-resolved="false"></xref> of all its segments first, then, per segment, <xref href="LlamaLogic.Architecture.WallBlockSegment.Kind" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.WallBlockSegment.Unknown1" data-throw-if-not-resolved="false"></xref> (versions before 23), the stored slots in slot order, then <xref href="LlamaLogic.Architecture.WallBlockSegment.FenceStamp" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.WallBlockSegment.CeilingRailStamp" data-throw-if-not-resolved="false"></xref> (versions after 25).</p>
  example: []
  syntax:
    content: public sealed class WallBlockSegment
