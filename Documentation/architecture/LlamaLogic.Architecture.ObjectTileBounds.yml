  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: 'Represents one entry of an <xref href="LlamaLogic.Architecture.ObjectTileBoundsSection" data-throw-if-not-resolved="false"></xref>: the tiles an object covers'
  remarks: >-
    The game computes the rectangle from the object's world bounds, rounded out to whole tiles and clipped to the lot.

    It is stored as <xref href="LlamaLogic.Architecture.ObjectTileBounds.MinimumZ" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.ObjectTileBounds.MaximumZ" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.ObjectTileBounds.MinimumX" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.ObjectTileBounds.MaximumX" data-throw-if-not-resolved="false"></xref>, in that order; each minimum is at or below its maximum in every lot examined.
  example: []
  syntax:
    content: public sealed class ObjectTileBounds
    content.vb: Public NotInheritable Class ObjectTileBounds
