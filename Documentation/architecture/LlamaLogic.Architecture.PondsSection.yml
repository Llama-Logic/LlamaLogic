  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.Ponds\" data-throw-if-not-resolved=\"false\"></xref> section: the lot's ponds and the tile quarters each one covers (\U0001F513)"
  remarks: >-
    Versions 0 through 3 are supported, as the game's reader accepts, and the game writes version 3, the only one in the lots examined.

    Versions 0 and 1 hold no ponds; <xref href="LlamaLogic.Architecture.PondCell.Unknown1" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.Pond.Unknown2" data-throw-if-not-resolved="false"></xref> exist from version 3.
