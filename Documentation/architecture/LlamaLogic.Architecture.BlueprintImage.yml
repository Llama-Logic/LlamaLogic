  summary: "Represents an image stored in a <xref href=\"LlamaLogic.Architecture.Blueprint\" data-throw-if-not-resolved=\"false\"></xref> (\U0001F513)"
  remarks: >-
    Every image observed is a JPEG.

    In every blueprint observed, the low 56 bits of <xref href="LlamaLogic.Architecture.BlueprintImage.Id" data-throw-if-not-resolved="false"></xref> are a counter unique within the blueprint and its high byte is 0x10, 0x30 or 0x50; what the id identifies has not been established.
