  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Represents one of the graphs of vertices and edges of the <xref href="LlamaLogic.Architecture.VertexGraphsSection" data-throw-if-not-resolved="false"></xref>
  remarks: >-
    The layout follows the game's writer; no code in the game's simulation library reads a graph back (other parts of the game were not examined). What each graph of the section describes is not established.

    Layout: <xref href="LlamaLogic.Architecture.VertexGraph.Unknown1" data-throw-if-not-resolved="false"></xref>, the tag "TREV", an <xref href="System.Int32" data-throw-if-not-resolved="false"></xref> count, the <xref href="LlamaLogic.Architecture.VertexGraph.Vertices" data-throw-if-not-resolved="false"></xref>, the tag "TCES", an <xref href="System.Int32" data-throw-if-not-resolved="false"></xref> count, then the <xref href="LlamaLogic.Architecture.VertexGraph.Edges" data-throw-if-not-resolved="false"></xref>.
