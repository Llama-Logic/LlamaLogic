  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the number of uses of the layer
  remarks: >-
    The game's writer drops the layers whose count is 0.

    It equals the number of nonzero mask values in every layer examined; this library does not recompute it.
  example: []
  syntax:
    content: public uint UseCount { get; set; }
    parameters: []
    return:
      type: System.UInt32
