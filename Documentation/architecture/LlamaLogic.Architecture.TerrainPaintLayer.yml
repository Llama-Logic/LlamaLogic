  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets whether the layer has a mask, written from version 3
  remarks: >-
    The game's writer writes <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> and the mask, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> and no mask, but its reader reads a mask either way, and so does this library.

    It is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> in every lot examined.
  example: []
  syntax:
    content: public bool HasMask { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property HasMask As Boolean
