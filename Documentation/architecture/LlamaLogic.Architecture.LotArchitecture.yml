- uid: LlamaLogic.Architecture.LotArchitecture.GetManifestKeys
  commentId: M:LlamaLogic.Architecture.LotArchitecture.GetManifestKeys
  id: GetManifestKeys
  parent: LlamaLogic.Architecture.LotArchitecture
  langs:
  - csharp
  - vb
  name: GetManifestKeys()
  nameWithType: LotArchitecture.GetManifestKeys()
  fullName: LlamaLogic.Architecture.LotArchitecture.GetManifestKeys()
  type: Method
  source:
    remote:
      path: LlamaLogic.Architecture/LotArchitecture.cs
      branch: main
      repo: https://github.com/Llama-Logic/LlamaLogic.git
    id: GetManifestKeys
    path: ../LlamaLogic.Architecture/LotArchitecture.cs
    startLine: 538
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets the keys the sections reference, in the order the game's saver would collect them into the <xref href="LlamaLogic.Architecture.LotArchitecture.ResourceManifest" data-throw-if-not-resolved="false"></xref>
  remarks: >-
    The game builds the manifest by recording every key it writes while saving the sections that precede the manifest, in its fixed save order, skipping repeats.

    This method does the same with the current sections, so assigning the result to a new <xref href="LlamaLogic.Architecture.ResourceManifestSection" data-throw-if-not-resolved="false"></xref> keeps the manifest consistent after edits.

    No code in the game's simulation library reads the manifest back (other parts of the game were not examined).

    For 2,907 of 2,912 lots in the game's world files, save games and tray blueprints examined, the result equals the stored manifest; the exceptions are lots of older world files whose blocks hold inline keys, which the current game no longer writes, and one saved lot whose stored manifest lacks two keys its sections reference.
  example: []
  syntax:
    content: public IReadOnlyList<ResourceKey> GetManifestKeys()
    return:
      type: System.Collections.Generic.IReadOnlyList{LlamaLogic.Packages.ResourceKey}
    content.vb: Public Function GetManifestKeys() As IReadOnlyList(Of ResourceKey)
  overload: LlamaLogic.Architecture.LotArchitecture.GetManifestKeys*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: A section cannot be encoded as it is
