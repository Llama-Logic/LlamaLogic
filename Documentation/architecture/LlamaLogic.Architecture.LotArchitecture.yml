  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the architecture of a lot: its walls, floors, roofs, stairs, terrain and the rest of its build, as typed sections (\U0001F513)"
  remarks: >-
    <p>The game stores a lot's architecture as a <xref href="LlamaLogic.Packages.Formats.RecordBundle" data-throw-if-not-resolved="false"></xref> in three places: the <xref href="LlamaLogic.Packages.ResourceType.WorldLotArchitecture" data-throw-if-not-resolved="false"></xref> resources of world files, the architecture data of each lot in a save game (see <xref href="LlamaLogic.Architecture.ZoneArchitecture" data-throw-if-not-resolved="false"></xref>) and tray blueprints (see <xref href="LlamaLogic.Architecture.Blueprint" data-throw-if-not-resolved="false"></xref>).

    Each record of the bundle is one section, keyed by its <xref href="LlamaLogic.Architecture.LotArchitectureSectionType" data-throw-if-not-resolved="false"></xref>, group 0 and instance 1.</p>

    <p>Many sections can only be read with the lot's dimensions, which the <xref href="LlamaLogic.Architecture.LotArchitecture.LotSize" data-throw-if-not-resolved="false"></xref> section gives, so the bundle, not the section, is the unit of decoding.

    Records <xref href="LlamaLogic.Architecture.LotArchitecture.Decode(LlamaLogic.Packages.Formats.RecordBundle)" data-throw-if-not-resolved="false"></xref> cannot turn into sections are kept, unchanged, in <xref href="LlamaLogic.Architecture.LotArchitecture.UndecodedRecords" data-throw-if-not-resolved="false"></xref>: those of types this library does not know, those with another group or instance, those with a version (of the section or of an element of it) or a floor feature layer type this library does not support, and those that need dimensions an older <xref href="LlamaLogic.Architecture.LotArchitecture.LotSize" data-throw-if-not-resolved="false"></xref> section does not give (the game itself discards those).</p>

    <p><xref href="LlamaLogic.Architecture.LotArchitecture.Encode" data-throw-if-not-resolved="false"></xref> writes the sections in the layout of their versions, so decoding and encoding the architecture of any lot the game wrote reproduces it byte for byte.</p>

    <p>Where the documentation of the sections speaks of the lots, sections or entries examined, it means the 2,919 lot architectures examined while developing this library, at the game's patch level as of October 2026: those of the lots of the game's installed world files (of which twelve base-game worlds had been replaced by a community lot-replacement mod), the 179 lots of the Maxis originals of those twelve worlds, the lots of four save games and 73 tray blueprints.</p>
