  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.Unknown7B33C1F5\" data-throw-if-not-resolved=\"false\"></xref> section: two lists of 64-bit values whose meaning has not been established (\U0001F513)"
  remarks: >-
    <p>Version 2 is the only one.

    Each list is preceded by a 16-bit count.</p>

    <p>Only three of the lots examined hold this section: one lot of one world, in both its installed and its Maxis original form, and one lot of another world. The three are identical: <xref href="LlamaLogic.Architecture.Unknown7B33C1F5Section.FirstValues" data-throw-if-not-resolved="false"></xref> holds 20 values and <xref href="LlamaLogic.Architecture.Unknown7B33C1F5Section.SecondValues" data-throw-if-not-resolved="false"></xref> holds 1.

    Hypothesis: the values are object ids, because they resemble them, but none of them appears elsewhere in the same bundle.</p>
  example: []
