  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Represents a table of catalog product keys and the ids by which the rest of a section refers to them
  remarks: >-
    <p>The layout follows the game's reader and writer.

    When the game adds a key, it gives a new key the lowest id from 1 up that is not in use, and adds the added amount to the <xref href="LlamaLogic.Architecture.ProductTableEntry.ReferenceCount" data-throw-if-not-resolved="false"></xref> of a key that is already present.

    Id 0 stands for <xref href="LlamaLogic.Architecture.ProductTable.DefaultKey" data-throw-if-not-resolved="false"></xref>: the table returns 0 for that key and never adds it.</p>

    <p>Layout: <xref href="LlamaLogic.Architecture.ProductTable.DefaultKey" data-throw-if-not-resolved="false"></xref> (instance, type, group), a <xref href="System.UInt32" data-throw-if-not-resolved="false"></xref> count, then the <xref href="LlamaLogic.Architecture.ProductTable.Entries" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public sealed class ProductTable
    content.vb: Public NotInheritable Class ProductTable
