  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the last step of the stair's step range
  remarks: >-
    Present from version 14 on. When it is 65,535, the game computes it while loading as the total step count minus 1 (or the total with bit 3 of <xref href="LlamaLogic.Architecture.Stair.Flags" data-throw-if-not-resolved="false"></xref> set).

    It was the total step count minus 1 in every in-game test (11 for 12 steps, 19 for 20).
  example: []
