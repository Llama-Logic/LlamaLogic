  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Represents one stair or ladder of a <xref href="LlamaLogic.Architecture.StairsSection" data-throw-if-not-resolved="false"></xref>
  remarks: >-
    <p>Each stair is also a lot object: <xref href="LlamaLogic.Architecture.Stair.ObjectId" data-throw-if-not-resolved="false"></xref> is the id of its object in <xref href="LlamaLogic.Architecture.LotObjectsSection" data-throw-if-not-resolved="false"></xref>.</p>

    <p>Before version 7, a stair holds a second position and its bottom level (<xref href="LlamaLogic.Architecture.Stair.LegacyX" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.Stair.LegacyZ" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.Stair.BottomLevel" data-throw-if-not-resolved="false"></xref>) ahead of <xref href="LlamaLogic.Architecture.Stair.AnchorX" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.Stair.AnchorZ" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.Stair.TopLevel" data-throw-if-not-resolved="false"></xref>, and no stages: the game derives one stage from the distance between the two positions and computes <xref href="LlamaLogic.Architecture.Stair.TopElevation" data-throw-if-not-resolved="false"></xref> while loading.

    Versions 7 through 9 hold exactly one stage and versions 10 and later a 16-bit stage count.

    Before version 8, <xref href="LlamaLogic.Architecture.Stair.Flags" data-throw-if-not-resolved="false"></xref> is stored as separate Booleans (four, or six from version 6 on).</p>
