      path: LlamaLogic.Architecture/Sections/Stair.cs
      branch: main
      repo: https://github.com/Llama-Logic/LlamaLogic.git
    id: Flags
    path: ../LlamaLogic.Architecture/Sections/Stair.cs
    startLine: 141
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the flags of the stair
  remarks: >-
    Before version 8, bits 0 through 3 (and bits 4 and 5 from version 6 on) are stored as Booleans, and the other bits cannot be stored.

    The game recomputes bits 4 and 5 while loading when <xref href="LlamaLogic.Architecture.StairsSection.Unknown1" data-throw-if-not-resolved="false"></xref> is set, and sets bits 11 and 12 when bit 0 is set and <xref href="LlamaLogic.Architecture.Stair.LastStep" data-throw-if-not-resolved="false"></xref> is 65,535; the meaning of the bits is otherwise unknown.

    Changing the railing in game set bits 0x0001 and 0x1800 together with <xref href="LlamaLogic.Architecture.Stair.RailingKey" data-throw-if-not-resolved="false"></xref> (in-game test).
  example: []
  syntax:
    content: public ushort Flags { get; set; }
    parameters: []
    return:
      type: System.UInt16
    content.vb: Public Property Flags As UShort
  overload: LlamaLogic.Architecture.Stair.Flags*
