  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.TerrainPaint\" data-throw-if-not-resolved=\"false\"></xref> section: the terrain paint layers, each a paint and a mask of where it is applied (\U0001F513)"
  remarks: >-
    <p>The game's reader and writer keep two sets of layers, <xref href="LlamaLogic.Architecture.TerrainPaintSection.LayerSet0" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.TerrainPaintSection.LayerSet1" data-throw-if-not-resolved="false"></xref>; what distinguishes them has not been established.

    The headers of the layers (key and use count) come first, set by set, then <xref href="LlamaLogic.Architecture.TerrainPaintSection.MaskSizeX" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.TerrainPaintSection.MaskSizeZ" data-throw-if-not-resolved="false"></xref>, then the masks, in the same order.</p>

    <p>Versions 2 through 4 are supported, and the game writes version 4; the lots examined hold versions 2 and 4.

    Version 2 has only <xref href="LlamaLogic.Architecture.TerrainPaintSection.LayerSet1" data-throw-if-not-resolved="false"></xref>, followed by <xref href="LlamaLogic.Architecture.TerrainPaintSection.Unknown1" data-throw-if-not-resolved="false"></xref>, and its layers have no <xref href="LlamaLogic.Architecture.TerrainPaintLayer.HasMask" data-throw-if-not-resolved="false"></xref>.

    Version 3 stores <xref href="LlamaLogic.Architecture.TerrainPaintSection.LayerSet1" data-throw-if-not-resolved="false"></xref> before <xref href="LlamaLogic.Architecture.TerrainPaintSection.LayerSet0" data-throw-if-not-resolved="false"></xref>; version 4 stores <xref href="LlamaLogic.Architecture.TerrainPaintSection.LayerSet0" data-throw-if-not-resolved="false"></xref> first.</p>

    <p>The game writes no keys of this section into the <xref href="LlamaLogic.Architecture.ResourceManifestSection" data-throw-if-not-resolved="false"></xref>, which it saves earlier.</p>
  example: []
  syntax:
    content: 'public sealed class TerrainPaintSection : LotArchitectureSection'
    content.vb: Public NotInheritable Class TerrainPaintSection Inherits LotArchitectureSection
