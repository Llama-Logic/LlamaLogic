    path: ../LlamaLogic.Architecture/WorldLotObjectsModel.cs
    startLine: 11
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents a <xref href=\"LlamaLogic.Packages.ResourceType.WorldLotObjects\" data-throw-if-not-resolved=\"false\"></xref> resource: the objects of a lot template in a world file, as a <code>LotObjectList</code> protobuf message in protobuf text format (\U0001F513)"
  remarks: >-
    <p>The game names the resource after the lot template it belongs to; see <xref href="LlamaLogic.Architecture.WorldLotObjectsModel.GetKey(System.UInt32)" data-throw-if-not-resolved="false"></xref>.

    Its <xref href="LlamaLogic.Packages.ResourceType.WorldLotArchitecture" data-throw-if-not-resolved="false"></xref> counterpart holds the lot template's architecture.</p>

    <p>Maxis writes the text with fields in field-number order, two-space indentation, CRLF line endings and floats in .NET Framework's round-trip format; <xref href="LlamaLogic.Architecture.WorldLotObjectsModel.Encode" data-throw-if-not-resolved="false"></xref> writes the same, so it reproduces every resource Maxis wrote byte for byte.

    <xref href="LlamaLogic.Architecture.WorldLotObjectsModel.Decode(System.ReadOnlyMemory%7bSystem.Byte%7d)" data-throw-if-not-resolved="false"></xref> also reads text written otherwise (community tools add commas, reorder fields or write hexadecimal integers), and <xref href="LlamaLogic.Architecture.WorldLotObjectsModel.Encode" data-throw-if-not-resolved="false"></xref> returns the decoded bytes unchanged as long as <xref href="LlamaLogic.Architecture.WorldLotObjectsModel.LotObjects" data-throw-if-not-resolved="false"></xref> is unchanged.</p>
  example: []
  syntax:
    content: 'public sealed class WorldLotObjectsModel : Model, IModel<WorldLotObjectsModel>, IModel'
    content.vb: Public NotInheritable Class WorldLotObjectsModel Inherits Model Implements IModel(Of WorldLotObjectsModel), IModel
