  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.Revision\" data-throw-if-not-resolved=\"false\"></xref> section: the lot's revision counter (\U0001F513)"
  remarks: >-
    <p>The game keeps the counter on the lot, starts it at 1 and increments it whenever the lot is modified, for example when the height of a level changes.

    It writes the section only when a save flag is set.</p>

    <p>The section has no version.

    In the lots examined the value fits in 32 bits, from 1 to 587,252.</p>
