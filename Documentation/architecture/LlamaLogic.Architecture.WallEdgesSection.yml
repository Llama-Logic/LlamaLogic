  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.WallEdges\" data-throw-if-not-resolved=\"false\"></xref> section: the wall patterns and catalog products along the lot's wall edges (\U0001F513)"
  remarks: >-
    <p>The game reads and writes the section right after the <xref href="LlamaLogic.Architecture.VertexGraphsSection" data-throw-if-not-resolved="false"></xref>, whose <xref href="LlamaLogic.Architecture.VertexGraphsSection.Version" data-throw-if-not-resolved="false"></xref> decides the layout; so the section can only be read and written together with that section.

    The section has no version of its own; the game writes it for a <xref href="LlamaLogic.Architecture.VertexGraphsSection" data-throw-if-not-resolved="false"></xref> of version 9.</p>

    <p>Layout: a <xref href="System.UInt32" data-throw-if-not-resolved="false"></xref> count, the <xref href="LlamaLogic.Architecture.WallEdgesSection.WallPatternEdges" data-throw-if-not-resolved="false"></xref> and the <xref href="LlamaLogic.Architecture.WallEdgesSection.WallPatterns" data-throw-if-not-resolved="false"></xref> table;

    if the vertex graphs version is above 1, the <xref href="LlamaLogic.Architecture.WallEdgesSection.Products" data-throw-if-not-resolved="false"></xref> table, a <xref href="System.UInt32" data-throw-if-not-resolved="false"></xref> count and the <xref href="LlamaLogic.Architecture.WallEdgesSection.ProductEdges" data-throw-if-not-resolved="false"></xref>;

    if it is 6, a <xref href="System.UInt32" data-throw-if-not-resolved="false"></xref> count and the <xref href="LlamaLogic.Architecture.WallEdgesSection.LegacyEntries" data-throw-if-not-resolved="false"></xref>;

    if it is above 8, the <xref href="LlamaLogic.Architecture.WallEdgesSection.AdditionalProducts" data-throw-if-not-resolved="false"></xref> table, a <xref href="System.UInt32" data-throw-if-not-resolved="false"></xref> count and the <xref href="LlamaLogic.Architecture.WallEdgesSection.AdditionalProductEdges" data-throw-if-not-resolved="false"></xref>.</p>

    <p>Encoding throws an <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref> when a table or list that the layout of the vertex graphs version lacks is not empty.</p>

    <p>Other tools detect the optional parts by the length that remains; in every lot examined that gives the same split as the version gates.</p>
