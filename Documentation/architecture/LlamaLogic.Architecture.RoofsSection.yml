  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.Roofs\" data-throw-if-not-resolved=\"false\"></xref> section: the lot's roofs (\U0001F513)"
  remarks: >-
    <p>The header holds <xref href="LlamaLogic.Architecture.RoofsSection.LegacyKey" data-throw-if-not-resolved="false"></xref> (before version 8), <xref href="LlamaLogic.Architecture.RoofsSection.ReservedKey" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.RoofsSection.Unknown1" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.RoofsSection.Unknown2" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.RoofsSection.Unknown3" data-throw-if-not-resolved="false"></xref> and the roof count (a 32-bit value); the roofs follow.

    The layout of each roof depends on the version, as <xref href="LlamaLogic.Architecture.Roof" data-throw-if-not-resolved="false"></xref> describes.</p>

    <p>Versions 5 through 13 are supported, and the game writes version 13.</p>

    <p>In-game tests show that a roof's shape is decided by its <xref href="LlamaLogic.Architecture.Roof.RoofKey" data-throw-if-not-resolved="false"></xref> alone, with the per-side bytes following the shape; <xref href="LlamaLogic.Architecture.Roof" data-throw-if-not-resolved="false"></xref> lists the observations.</p>
  example: []
  syntax:
    content: 'public sealed class RoofsSection : LotArchitectureSection'
    content.vb: Public NotInheritable Class RoofsSection Inherits LotArchitectureSection
  inheritance:
  - System.Object
  - LlamaLogic.Architecture.LotArchitectureSection
