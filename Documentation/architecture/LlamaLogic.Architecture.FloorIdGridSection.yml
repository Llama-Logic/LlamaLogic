  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents one of the seven floor id grids: the <xref href=\"LlamaLogic.Architecture.FloorKeysSection\" data-throw-if-not-resolved=\"false\"></xref> id painted on each quarter of each tile (\U0001F513)"
  remarks: >-
    <p>The grid has <xref href="LlamaLogic.Architecture.FloorIdGridSection.SizeX" data-throw-if-not-resolved="false"></xref> × <xref href="LlamaLogic.Architecture.FloorIdGridSection.SizeZ" data-throw-if-not-resolved="false"></xref> tiles per layer and four ids per tile, one per <xref href="LlamaLogic.Architecture.FloorQuarter" data-throw-if-not-resolved="false"></xref>.

    Each id is a <xref href="LlamaLogic.Architecture.FloorKeyEntry.Id" data-throw-if-not-resolved="false"></xref> of the lot's <xref href="LlamaLogic.Architecture.FloorKeysSection" data-throw-if-not-resolved="false"></xref>, whose key is a CTProductFloorPattern (0xB4F762C9); 0 means no floor.</p>

    <p>The types <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.Floors" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.Ceilings" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.PoolSurfaces" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.SecondaryFloors" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.CeilingPaints" data-throw-if-not-resolved="false"></xref> have one layer per level of the lot (<xref href="LlamaLogic.Architecture.FloorIdGridSection.HasLevels" data-throw-if-not-resolved="false"></xref>), indexed by level − <xref href="LlamaLogic.Architecture.LotInfoSection.LowestLevel" data-throw-if-not-resolved="false"></xref>, so ground level is index −<xref href="LlamaLogic.Architecture.LotInfoSection.LowestLevel" data-throw-if-not-resolved="false"></xref>.

    <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.TerrainFloors" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.PondBottoms" data-throw-if-not-resolved="false"></xref> have a single layer, for ground level.

    When the lot's <xref href="LlamaLogic.Architecture.LotSizeSection.Version" data-throw-if-not-resolved="false"></xref> is 8 or less, <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.PoolSurfaces" data-throw-if-not-resolved="false"></xref> also has a single layer, for ground level.</p>

    <p>Roles proven by the game's code and in-game tests: <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.Floors" data-throw-if-not-resolved="false"></xref> is the floor pattern of each level, <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.TerrainFloors" data-throw-if-not-resolved="false"></xref> the floor pattern painted on bare terrain, <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.PondBottoms" data-throw-if-not-resolved="false"></xref> the pond bottom pattern and <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.CeilingPaints" data-throw-if-not-resolved="false"></xref> the ceiling paint.

    In-game tests show that building a room fills <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.Ceilings" data-throw-if-not-resolved="false"></xref> at the level above the room over exactly the room's tiles (and painting the ceiling changes only <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.CeilingPaints" data-throw-if-not-resolved="false"></xref>), and that building a pool fills <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.PoolSurfaces" data-throw-if-not-resolved="false"></xref> over exactly the pool's tiles at the level above the pool's block; the game's code assigns both grids to the room on the level below their layer.

    In-game tests show that building a room or a platform fills <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.SecondaryFloors" data-throw-if-not-resolved="false"></xref> over its tiles with the lot's default floor key, and that painting a floor or a platform's top changes only <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.Floors" data-throw-if-not-resolved="false"></xref>; the role of <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.SecondaryFloors" data-throw-if-not-resolved="false"></xref>, which covers the same quarters as <xref href="LlamaLogic.Architecture.LotArchitectureSectionType.Floors" data-throw-if-not-resolved="false"></xref>, is still unknown.</p>

    <p>The layers are stored one after another, each as <xref href="LlamaLogic.Architecture.FloorIdGridSection.SizeX" data-throw-if-not-resolved="false"></xref> rows of <xref href="LlamaLogic.Architecture.FloorIdGridSection.SizeZ" data-throw-if-not-resolved="false"></xref> tiles of four little-endian 16-bit ids; the section has no version.</p>
  example: []
