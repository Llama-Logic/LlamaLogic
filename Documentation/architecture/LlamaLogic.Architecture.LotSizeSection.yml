  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.LotSize\" data-throw-if-not-resolved=\"false\"></xref> section: the lot's dimensions (\U0001F513)"
  remarks: >-
    <p>The grids of the other sections are <xref href="LlamaLogic.Architecture.LotSizeSection.SizeX" data-throw-if-not-resolved="false"></xref> tiles along the lot's local X axis by <xref href="LlamaLogic.Architecture.LotSizeSection.SizeZ" data-throw-if-not-resolved="false"></xref> tiles along its local Z axis, with one layer per level.

    <xref href="LlamaLogic.Architecture.LotSizeSection.LevelCount" data-throw-if-not-resolved="false"></xref> is the number of levels from the lowest to the highest of <xref href="LlamaLogic.Architecture.LotInfoSection" data-throw-if-not-resolved="false"></xref>, inclusive.</p>

    <p>Versions 2 through 13 are supported, and the game writes version 13.

    Version 2 holds no dimensions (<xref href="LlamaLogic.Architecture.LotSizeSection.HasDimensions" data-throw-if-not-resolved="false"></xref> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>); the game discards the floor data of such a lot.</p>
  example: []
  syntax:
    content: 'public sealed class LotSizeSection : LotArchitectureSection'
    content.vb: Public NotInheritable Class LotSizeSection Inherits LotArchitectureSection
  inheritance:
