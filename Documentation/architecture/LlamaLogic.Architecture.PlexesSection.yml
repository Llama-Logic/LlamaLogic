  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.Plexes\" data-throw-if-not-resolved=\"false\"></xref> section: the lot's plexes (units), with the blocks of their outlines (\U0001F513)"
  remarks: >-
    <p>The layout follows the game's reader and writer; the game reads the section only when the <xref href="LlamaLogic.Architecture.LotInfoSection" data-throw-if-not-resolved="false"></xref> is version 14 or later.

    Versions 1 through 9 are supported, and the game writes version 9.</p>

    <p>Layout: <xref href="LlamaLogic.Architecture.PlexesSection.Version" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.PlexesSection.Unknown1" data-throw-if-not-resolved="false"></xref> (after 2), a <xref href="System.UInt32" data-throw-if-not-resolved="false"></xref> plex count, the <xref href="LlamaLogic.Architecture.PlexesSection.Plexes" data-throw-if-not-resolved="false"></xref>,

    then after 7 a <xref href="System.UInt32" data-throw-if-not-resolved="false"></xref> count of <xref href="LlamaLogic.Architecture.PlexesSection.Unknown2" data-throw-if-not-resolved="false"></xref>, and only if it is not 0: <xref href="LlamaLogic.Architecture.PlexesSection.Unknown2" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.PlexesSection.Unknown3" data-throw-if-not-resolved="false"></xref>, a <xref href="System.UInt32" data-throw-if-not-resolved="false"></xref> count and <xref href="LlamaLogic.Architecture.PlexesSection.Unknown4" data-throw-if-not-resolved="false"></xref>;

    then after 8 a <xref href="System.UInt16" data-throw-if-not-resolved="false"></xref> count and the <xref href="LlamaLogic.Architecture.PlexesSection.GroupMaps" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: 'public sealed class PlexesSection : LotArchitectureSection'
    content.vb: Public NotInheritable Class PlexesSection Inherits LotArchitectureSection
