  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.Stairs\" data-throw-if-not-resolved=\"false\"></xref> section: the lot's stairs and ladders (\U0001F513)"
  remarks: >-
    <p>The header holds <xref href="LlamaLogic.Architecture.StairsSection.Unknown1" data-throw-if-not-resolved="false"></xref> (from version 9 on) and the stair count (8 bits before version 9, 16 bits from then on); the stairs follow, and from version 11 on a 16-bit ladder count and the ladders.

    The layout of each stair or ladder depends on the version, as <xref href="LlamaLogic.Architecture.Stair" data-throw-if-not-resolved="false"></xref> describes.</p>

    <p>Versions 4 through 15 are supported, and the game writes version 15.</p>
  example: []
