  summary: Gets/sets the unknown value of the header
  remarks: >-
    Present from version 9 on; the game sets it for older versions.

    When it is set, the game recomputes bits 4 and 5 of each stair's <xref href="LlamaLogic.Architecture.Stair.Flags" data-throw-if-not-resolved="false"></xref> while loading.
