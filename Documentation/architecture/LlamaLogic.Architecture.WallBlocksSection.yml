  langs:
  - csharp
  - vb
  name: StampCounter
  nameWithType: WallBlocksSection.StampCounter
  fullName: LlamaLogic.Architecture.WallBlocksSection.StampCounter
  type: Property
  source:
    remote:
      path: LlamaLogic.Architecture/Sections/WallBlocksSection.cs
      branch: main
      repo: https://github.com/Llama-Logic/LlamaLogic.git
    id: StampCounter
    path: ../LlamaLogic.Architecture/Sections/WallBlocksSection.cs
    startLine: 57
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the counter from which the game stamps <xref href="LlamaLogic.Architecture.WallBlockSegment.FenceStamp" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.WallBlockSegment.CeilingRailStamp" data-throw-if-not-resolved="false"></xref>
  remarks: >-
    The game keeps it at offset 0x58 of its block manager.

    Adding a foundation raised it by 1 and set the stamps of the block's segments to the new value (in-game test).

    It is at least the highest <xref href="LlamaLogic.Architecture.WallBlock.Id" data-throw-if-not-resolved="false"></xref> in every lot examined; of the 653 lots examined without blocks, 450 hold 0 and the rest 1 through 143,271. Whether the game also allocates block ids from it is a hypothesis.

    Stored from version 2 on.
  example: []
  syntax:
    content: public uint StampCounter { get; set; }
    parameters: []
    return:
      type: System.UInt32
    content.vb: Public Property StampCounter As UInteger
  overload: LlamaLogic.Architecture.WallBlocksSection.StampCounter*
