  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.WallBlocks\" data-throw-if-not-resolved=\"false\"></xref> section: the lot's blocks, which are its rooms, wall lines, fence lines, pools and fountains (\U0001F513)"
  remarks: >-
    <p>The layout follows the game's reader and writer.

    Versions 0 through 2 are supported, and the game writes version 2; the lots examined hold only version 2.</p>

    <p>Layout: <xref href="LlamaLogic.Architecture.WallBlocksSection.Version" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.WallBlocksSection.StampCounter" data-throw-if-not-resolved="false"></xref> (after 1), a <xref href="System.UInt16" data-throw-if-not-resolved="false"></xref> block count, then per block its <xref href="LlamaLogic.Architecture.WallBlock.Id" data-throw-if-not-resolved="false"></xref> (<xref href="System.UInt16" data-throw-if-not-resolved="false"></xref>, the key of the game's block map, which the game writes from the block) and the <xref href="LlamaLogic.Architecture.WallBlock" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: 'public sealed class WallBlocksSection : LotArchitectureSection'
    content.vb: Public NotInheritable Class WallBlocksSection Inherits LotArchitectureSection
