  summary: Gets/sets the key under which the game maps the entry
  remarks: "It is packed like <xref href=\"LlamaLogic.Architecture.WallEdgePatterns.MapKey\" data-throw-if-not-resolved=\"false\"></xref> (hypothesis). In <xref href=\"LlamaLogic.Architecture.WallEdgesSection.ProductEdges\" data-throw-if-not-resolved=\"false\"></xref> the low nibble of byte 0 follows the product's catalog type in the lots examined: 0 for CTProductWall, 1 for ceiling rails, 2 for fences and railings, and 3 for some fences."
