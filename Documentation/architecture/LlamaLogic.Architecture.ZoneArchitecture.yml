  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: 'Provides access to the architecture of the lots of a zone in a save game: the <code>architecture_data</code> field of the <code>EA.Sims4.Persistence.ZoneObjectData</code> protobuf message, the content of a <xref href="LlamaLogic.Packages.ResourceType.ZoneObjectData" data-throw-if-not-resolved="false"></xref> resource'
  remarks: >-
    <p><code>architecture_data</code> is a repeated field parallel to the message's <code>objects</code> field, and <code>active_data_index</code> selects the entry in use.

    Most zones have one entry, some have none, and a few have several.</p>

    <p>These methods read and replace only that field's entries in the message's bytes and copy everything else verbatim, so they never re-serialize the rest of the message.</p>
  example: []
