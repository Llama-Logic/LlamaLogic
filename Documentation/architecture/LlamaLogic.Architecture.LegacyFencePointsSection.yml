  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents the <xref href=\"LlamaLogic.Architecture.LotArchitectureSectionType.LegacyFencePoints\" data-throw-if-not-resolved=\"false\"></xref> section: two lists of points with fence and ceiling rail keys, found only in older world files (\U0001F513)"
  remarks: >-
    <p>No code in the game's simulation library reads or writes this section (other parts of the game were not examined), so the layout comes from the lots examined and every meaning is a hypothesis.

    The lots examined hold 21 of these sections, all in world files, 15 of them empty.

    Hypothesis: the points are post or end-piece positions of the fences and ceiling rails of the <xref href="LlamaLogic.Architecture.LegacyWallGraphSection" data-throw-if-not-resolved="false"></xref>.</p>

    <p>Version 2 is the only one supported, and the only one in the lots examined.</p>

    <p>Layout: the version (<xref href="System.UInt32" data-throw-if-not-resolved="false"></xref>), an <xref href="System.Int32" data-throw-if-not-resolved="false"></xref> count and the <xref href="LlamaLogic.Architecture.LegacyFencePointsSection.Points1" data-throw-if-not-resolved="false"></xref>, then an <xref href="System.Int32" data-throw-if-not-resolved="false"></xref> count and the <xref href="LlamaLogic.Architecture.LegacyFencePointsSection.Points2" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: 'public sealed class LegacyFencePointsSection : LotArchitectureSection'
    content.vb: Public NotInheritable Class LegacyFencePointsSection Inherits LotArchitectureSection
