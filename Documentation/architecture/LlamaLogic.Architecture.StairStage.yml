  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: 'Represents one stage of a <xref href="LlamaLogic.Architecture.Stair" data-throw-if-not-resolved="false"></xref>: a straight run of steps'
  remarks: >-
    <p>A stage is stored as a 16-bit value holding <xref href="LlamaLogic.Architecture.StairStage.StepCount" data-throw-if-not-resolved="false"></xref> in its low 10 bits and a byte (<xref href="LlamaLogic.Architecture.StairStage.Unknown1" data-throw-if-not-resolved="false"></xref>).

    From version 13 of <xref href="LlamaLogic.Architecture.StairsSection" data-throw-if-not-resolved="false"></xref> on, each stage also has <xref href="LlamaLogic.Architecture.StairStage.Unknown2" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.StairStage.Unknown3" data-throw-if-not-resolved="false"></xref>, and from version 15 on <xref href="LlamaLogic.Architecture.StairStage.Unknown4" data-throw-if-not-resolved="false"></xref>; these follow the stair's other fields, one set per stage in stage order.</p>

    <p>The game keeps only the low 10 bits of <xref href="LlamaLogic.Architecture.StairStage.StoredStepCount" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.StairStage.Unknown2" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Architecture.StairStage.Unknown3" data-throw-if-not-resolved="false"></xref>, the low 6 bits of <xref href="LlamaLogic.Architecture.StairStage.Unknown1" data-throw-if-not-resolved="false"></xref> and the low 4 bits of <xref href="LlamaLogic.Architecture.StairStage.Unknown4" data-throw-if-not-resolved="false"></xref>, and writes only those; the stored values are kept whole here so that every record round-trips.</p>

    <p>In-game tests: a straight flight of 12 steps had one stage with <xref href="LlamaLogic.Architecture.StairStage.Unknown2" data-throw-if-not-resolved="false"></xref> 5 and <xref href="LlamaLogic.Architecture.StairStage.Unknown3" data-throw-if-not-resolved="false"></xref> 7; turning its upper part 90° split it into a stage of 8 steps (<xref href="LlamaLogic.Architecture.StairStage.Unknown2" data-throw-if-not-resolved="false"></xref> 8, <xref href="LlamaLogic.Architecture.StairStage.Unknown3" data-throw-if-not-resolved="false"></xref> 0) and one of 4 (<xref href="LlamaLogic.Architecture.StairStage.Unknown2" data-throw-if-not-resolved="false"></xref> 0, <xref href="LlamaLogic.Architecture.StairStage.Unknown3" data-throw-if-not-resolved="false"></xref> 4), both with <xref href="LlamaLogic.Architecture.StairStage.Unknown1" data-throw-if-not-resolved="false"></xref> 2; after taller walls and a landing, the stages had 12 steps (<xref href="LlamaLogic.Architecture.StairStage.Unknown1" data-throw-if-not-resolved="false"></xref> 2) and 8 (<xref href="LlamaLogic.Architecture.StairStage.Unknown1" data-throw-if-not-resolved="false"></xref> 4).

    These are observations; the meanings of the values are not proven.</p>
  example: []
  syntax:
    content: public sealed class StairStage
    content.vb: Public NotInheritable Class StairStage
