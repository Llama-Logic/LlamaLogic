    path: ../LlamaLogic.Architecture/Blueprint.cs
    startLine: 12
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: "Represents a tray blueprint (a <code>.blueprint</code> file): a lot's objects and architecture (\U0001F513)"
  remarks: >-
    <p>The file is a 32-bit version and the length of its content, followed by the content compressed with Snappy (the raw block format).

    The content is a header, the <xref href="LlamaLogic.Architecture.Blueprint.LotObjects" data-throw-if-not-resolved="false"></xref> as a protobuf message, <xref href="LlamaLogic.Architecture.Blueprint.ObjectDefinitionMappings" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Architecture.Blueprint.Images" data-throw-if-not-resolved="false"></xref> and finally the <xref href="LlamaLogic.Architecture.Blueprint.Architecture" data-throw-if-not-resolved="false"></xref> as a record bundle.

    Blueprints without the header (<xref href="LlamaLogic.Architecture.Blueprint.HasHeader" data-throw-if-not-resolved="false"></xref> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>) hold only the objects and the architecture; Sims 4 Studio reads them, but none has been observed.</p>

    <p>Snappy compressors differ in their output, so <xref href="LlamaLogic.Architecture.Blueprint.Encode" data-throw-if-not-resolved="false"></xref> reuses the compressed bytes it decoded when the content it would write is unchanged, and otherwise compresses the content anew.

    Decoding and encoding a blueprint the game wrote therefore reproduces it byte for byte.</p>
  example: []
  syntax:
    content: public sealed class Blueprint
    content.vb: Public NotInheritable Class Blueprint
