    path: ../LlamaLogic.Architecture/Sections/WallBlockType.cs
    startLine: 8
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Specifies the type of a <xref href="LlamaLogic.Architecture.WallBlock" data-throw-if-not-resolved="false"></xref>
  remarks: "The game checks each block type against the <xref href=\"LlamaLogic.Architecture.WallBlockSegmentKind\" data-throw-if-not-resolved=\"false\"></xref> of the block's segments with a table: a <xref href=\"LlamaLogic.Architecture.WallBlockType.Fence\" data-throw-if-not-resolved=\"false\"></xref> block allows only <xref href=\"LlamaLogic.Architecture.WallBlockSegmentKind.Open\" data-throw-if-not-resolved=\"false\"></xref>, a <xref href=\"LlamaLogic.Architecture.WallBlockType.Fountain\" data-throw-if-not-resolved=\"false\"></xref> or <xref href=\"LlamaLogic.Architecture.WallBlockType.Pool\" data-throw-if-not-resolved=\"false\"></xref> block only <xref href=\"LlamaLogic.Architecture.WallBlockSegmentKind.Wall\" data-throw-if-not-resolved=\"false\"></xref> and <xref href=\"LlamaLogic.Architecture.WallBlockSegmentKind.ModularPieceWithWall\" data-throw-if-not-resolved=\"false\"></xref> (otherwise BlockTypeIncompatibleWithProduct)."
  example: []
  syntax:
    content: >-
      [SuppressMessage("Design", "CA1028: Enum Storage should be Int32", Justification = "The game stores the value as a byte.")]

      public enum WallBlockType : byte
    content.vb: >-
      <SuppressMessage("Design", "CA1028: Enum Storage should be Int32", Justification:="The game stores the value as a byte.")>

      Public Enum WallBlockType As Byte
