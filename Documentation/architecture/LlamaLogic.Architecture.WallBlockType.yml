  source:
    remote:
      path: LlamaLogic.Architecture/Sections/WallBlockType.cs
      branch: main
      repo: https://github.com/Llama-Logic/LlamaLogic.git
    id: Standard
    path: ../LlamaLogic.Architecture/Sections/WallBlockType.cs
    startLine: 18
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: A block that is not a fence, fountain or pool
  remarks: 'In the lots examined these are rooms and free-standing wall lines, and a platform is a block of this type too: drawing one creates a block whose segments are all <xref href="LlamaLogic.Architecture.WallBlockSegmentKind.Open" data-throw-if-not-resolved="false"></xref> until walls are added, raised by <xref href="LlamaLogic.Architecture.WallBlock.FloorHeightOffset" data-throw-if-not-resolved="false"></xref> just as a room whose floor is raised (in-game tests); that the type covers nothing else is a hypothesis.'
  example: []
  syntax:
    content: Standard = 0
    return:
      type: LlamaLogic.Architecture.WallBlockType
