    id: ReferenceCount
    path: ../LlamaLogic.Architecture/Sections/FloorKeyEntry.cs
    startLine: 31
  assemblies:
  - LlamaLogic.Architecture
  namespace: LlamaLogic.Architecture
  summary: Gets/sets the number of references to the entry, counted in tile quarters
  remarks: >-
    The game decrements it as quarters stop using the id and frees the entry at 0; it is never 0 in the lots examined.

    It equals the number of quarters holding <xref href="LlamaLogic.Architecture.FloorKeyEntry.Id" data-throw-if-not-resolved="false"></xref> across the seven <xref href="LlamaLogic.Architecture.FloorIdGridSection" data-throw-if-not-resolved="false"></xref> grids in 18,597 of the 18,773 entries examined in lots whose grids can be read, and is larger in the rest, which suggests other sections also hold references.

    This library does not recompute it.
  example: []
  syntax:
    content: public uint ReferenceCount { get; set; }
    parameters: []
    return:
      type: System.UInt32
    content.vb: Public Property ReferenceCount As UInteger
  overload: LlamaLogic.Architecture.FloorKeyEntry.ReferenceCount*
