  assemblies:
  - LlamaLogic.TuningArchive
  namespace: LlamaLogic.TuningArchive
  summary: Finds a mod package's overrides of game tuning, works out what a game version means for each, and writes an updated copy of the package
  remarks: >-
    <p>

    For each override, the base (the game version the mod was most likely made from) is the archive snapshot, up to the target, whose version of the tuning has the fewest differences from the override.

    When versions with different content are as close, the base is the oldest of them, because they tie when the mod changed what the game later changed, and the older base shows that as a conflict rather than taking the mod's version as up to date.

    If the game changed the tuning between the base and the target, the mod's changes are merged onto the target's version (see <xref href="LlamaLogic.TuningArchive.TuningMerge" data-throw-if-not-resolved="false"></xref>).

    </p>

    <p>

    The package is never changed: <xref href="LlamaLogic.TuningArchive.TuningPackageUpdate.WriteAsync(System.String%2cSystem.Collections.Generic.IReadOnlyDictionary%7bLlamaLogic.Packages.ResourceKey%2cSystem.String%7d%2cLlamaLogic.TuningArchive.TuningPackageSimDataChanges%2cLlamaLogic.TuningArchive.TuningCommenter%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> writes a new one, copying every resource it is not told to change.

    </p>
  example: []
