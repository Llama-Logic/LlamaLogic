  summary: "Writes a copy of the package to the specified <code class=\"paramref\">path</code> with the specified <code class=\"paramref\">tuning</code> in place of the overrides it has keys for (<a href=\"https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null\">null</a> to remove an override), and, if the update has a SimData drafter, the specified <code class=\"paramref\">simDataChanges</code> made to each override's SimData (\U0001F3C3)"
  example: []
  syntax:
    content: public Task<IReadOnlyList<TuningPackageUpdateChange>> WriteAsync(string path, IReadOnlyDictionary<ResourceKey, string?> tuning, TuningPackageSimDataChanges simDataChanges = TuningPackageSimDataChanges.All, TuningCommenter? commenter = null, CancellationToken cancellationToken = default)
    parameters:
    - id: path
      type: System.String
      description: Where to write the updated package, which must not be the package's own path
    - id: tuning
      type: System.Collections.Generic.IReadOnlyDictionary{LlamaLogic.Packages.ResourceKey,System.String}
      description: The tuning to write in place of overrides, by key, such as from <xref href="LlamaLogic.TuningArchive.TuningPackageUpdate.GetRecommendedTuning" data-throw-if-not-resolved="false"></xref>
    - id: simDataChanges
      type: LlamaLogic.TuningArchive.TuningPackageSimDataChanges
      description: Which changes to make to the SimData, to make it what each override's tuning needs
    - id: commenter
