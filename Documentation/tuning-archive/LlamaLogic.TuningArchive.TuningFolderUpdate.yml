  assemblies:
  - LlamaLogic.TuningArchive
  namespace: LlamaLogic.TuningArchive
  summary: Finds the overrides of game tuning in every package in a folder and its subfolders, works out what a game version means for each, checks the SimData of the tuning the packages add against the game version's tuning descriptions, and writes updated copies of the packages with the changes that need no judgment from the creator, with a report of everything
  remarks: >-
    <p>

    The changes that need no judgment are merges without conflicts whose base is not uncertain (see <xref href="LlamaLogic.TuningArchive.TuningPackageOverride.BaseIsUncertain" data-throw-if-not-resolved="false"></xref>), the SimData changes and fixes the options allow, and, if the options say so, removing overrides that do nothing.

    Everything else is left as the package has it and marked in the report as needing the creator.

    </p>

    <p>

    The packages in the folder are never changed, and updated copies are never written inside it, where the game would load them beside the originals.

    </p>
