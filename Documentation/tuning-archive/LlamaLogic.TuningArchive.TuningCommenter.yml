  assemblies:
  - LlamaLogic.TuningArchive
  namespace: LlamaLogic.TuningArchive
  summary: 'Adds to tuning the comments XML Extractor adds, as a snapshot knows them: the text of each string after its key, and the class and name of the tuning or animation state machine each reference refers to'
  remarks: >-
    The comments are the ones <xref href="LlamaLogic.TuningArchive.TuningArchiveFile.ExportAsync(LlamaLogic.TuningArchive.TuningArchiveSnapshot%2cSystem.String%2cLlamaLogic.TuningArchive.TuningArchiveExportOptions%2cSystem.IProgress%7bLlamaLogic.TuningArchive.TuningArchiveProgress%7d%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> writes: found with the snapshot's tuning descriptions when it has them and they describe the tuning, and otherwise as XML Extractor finds them, as any number that is a string's key or a tuning's instance.

    References to tuning of packs that were not installed when the snapshot was captured are commented with the names the packs' patches give it (see <xref href="LlamaLogic.TuningArchive.TuningArchiveFile.GetUninstalledTunings(LlamaLogic.TuningArchive.TuningArchiveSnapshot)" data-throw-if-not-resolved="false"></xref>).

    The game ignores comments, so tuning with them loads as it would without them.
  example: []
  syntax:
    content: public sealed class TuningCommenter
    content.vb: Public NotInheritable Class TuningCommenter
