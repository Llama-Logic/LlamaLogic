  assemblies:
  - LlamaLogic.TuningArchive
  namespace: LlamaLogic.TuningArchive
  summary: Represents the SimData of tuning a package adds (rather than overrides), checked against SimData generated from the tuning with the tuning descriptions of the game version the package is being updated for
  remarks: The tuning descriptions say which columns the game version expects, so SimData made for an older version can be found missing columns without the game having SimData for the tuning.
