    parameters:
    - id: Path
      type: System.String
      description: The path of the package file
    - id: Priority
      type: System.Int32
      description: The priority the game's resource configuration assigns the package; when packages contain the same resource, the one with the greater priority prevails
    - id: IsPatch
      type: System.Boolean
      description: Whether the package is in the pack's folder under <code>Delta</code>, which patches the files installed with the pack
