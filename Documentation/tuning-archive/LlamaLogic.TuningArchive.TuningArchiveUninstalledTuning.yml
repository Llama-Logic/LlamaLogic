  namespace: LlamaLogic.TuningArchive
  summary: Represents a tuning of a pack that was not installed when a <xref href="LlamaLogic.TuningArchive.TuningArchiveSnapshot" data-throw-if-not-resolved="false"></xref> was captured, known only from the pack's patches in the game's <code>Delta</code> folder
  remarks: The game does not load a pack's patches unless the pack is installed, so such tuning is not in the snapshot; only its name is kept, so that what refers to it can still be explained.
