    - id: folder
      type: System.String
    - id: gameVersion
      type: System.String
    - id: options
      type: LlamaLogic.TuningArchive.TuningArchiveImportOptions
    - id: progress
      type: System.IProgress{LlamaLogic.TuningArchive.TuningArchiveProgress}
    - id: cancellationToken
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task{LlamaLogic.TuningArchive.TuningArchiveCaptureResult}
    content.vb: Public Function ImportFolderAsync(folder As String, gameVersion As String, options As TuningArchiveImportOptions = Nothing, progress As IProgress(Of TuningArchiveProgress) = Nothing, cancellationToken As CancellationToken = Nothing) As Task(Of TuningArchiveCaptureResult)
