  remarks: >-
    Tuning names some sounds sims sing or speak (<code>vocal_clip</code> in recipes, for example) by the FNV-1 64 hash of a file name that has no audio configuration of its own, such as <code>vo_karaoke_solojazz2_tune_67sec</code>.

