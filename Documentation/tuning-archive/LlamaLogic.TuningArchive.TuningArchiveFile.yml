- uid: LlamaLogic.TuningArchive.TuningArchiveFile.GetVoiceVersionSource(LlamaLogic.TuningArchive.TuningArchiveSnapshot,LlamaLogic.TuningArchive.TuningArchiveEntry)
  commentId: M:LlamaLogic.TuningArchive.TuningArchiveFile.GetVoiceVersionSource(LlamaLogic.TuningArchive.TuningArchiveSnapshot,LlamaLogic.TuningArchive.TuningArchiveEntry)
