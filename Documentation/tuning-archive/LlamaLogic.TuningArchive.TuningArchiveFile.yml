  type: Method
  source:
    remote:
      path: LlamaLogic.TuningArchive/TuningArchiveFile.Media.cs
      branch: main
      repo: https://github.com/Llama-Logic/LlamaLogic.git
    id: GetVoiceVersionSource
    path: ../LlamaLogic.TuningArchive/TuningArchiveFile.Media.cs
    startLine: 371
  assemblies:
  - LlamaLogic.TuningArchive
  namespace: LlamaLogic.TuningArchive
  summary: Gets the instance by which tuning names the audio configuration of which the specified <code class="paramref">entry</code> is a voice's version, with that voice's code, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> if it is not a voice's version (see <xref href="LlamaLogic.TuningArchive.TuningArchiveFile.GetVoiceVersionInstance(System.UInt64%2cSystem.String)" data-throw-if-not-resolved="false"></xref>)
  remarks: >-
    A configuration is taken to be a voice's version when tuning in the specified <code class="paramref">snapshot</code> refers to the configuration it would be a version of (only tunings whose references have been indexed are found; see <xref href="LlamaLogic.TuningArchive.TuningArchiveFile.IndexReferencesAsync(System.IProgress%7bLlamaLogic.TuningArchive.TuningArchiveProgress%7d%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>), or another voice's version of that configuration is in the snapshot.

    Codes that share their first letter differ only in the last character hashed, so working back with the wrong one of them leads to a configuration with versions of its own in the snapshot (this one, and the version for another voice of the same group); of the configurations it could be a version of, the one tuning refers to is preferred, then the one with the most versions in the snapshot.
  example: []
  syntax:
