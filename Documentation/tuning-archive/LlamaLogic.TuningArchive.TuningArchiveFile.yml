  assemblies:
  - LlamaLogic.TuningArchive
  namespace: LlamaLogic.TuningArchive
  summary: "Opens the existing archive at the specified <code class=\"paramref\">path</code> for reading only, without changing the file (\U0001F5D1️)"
  remarks: >-
    <p>

    The archive can be read while another application has it open with <xref href="LlamaLogic.TuningArchive.TuningArchiveFile.Open(System.String)" data-throw-if-not-resolved="false"></xref>, and sees what that application writes as it is written.

    Members that would change the archive throw <xref href="System.NotSupportedException" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    If the archive's reference index was built by a different version of this library, it is left as it is and treated as empty: members that use it find no references, and <xref href="LlamaLogic.TuningArchive.TuningArchiveFile.GetReferenceIndexStatus" data-throw-if-not-resolved="false"></xref> reports no tunings indexed.

    </p>
  example: []
  syntax:
    content: public static TuningArchiveFile OpenReadOnly(string path)
    parameters:
    - id: path
      type: System.String
    return:
      type: LlamaLogic.TuningArchive.TuningArchiveFile
    content.vb: Public Shared Function OpenReadOnly(path As String) As TuningArchiveFile
  overload: LlamaLogic.TuningArchive.TuningArchiveFile.OpenReadOnly*
  exceptions:
  - type: System.IO.FileNotFoundException
    commentId: T:System.IO.FileNotFoundException
    description: There is no file at <code class="paramref">path</code>
  - type: System.IO.InvalidDataException
    commentId: T:System.IO.InvalidDataException
    description: The file is not an archive, or is an archive created by a newer version of this library, or by an earlier version and not yet upgraded by opening it with <xref href="LlamaLogic.TuningArchive.TuningArchiveFile.Open(System.String)" data-throw-if-not-resolved="false"></xref>
  nameWithType.vb: TuningArchiveFile.OpenReadOnly(String)
