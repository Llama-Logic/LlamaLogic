      type: System.Threading.Tasks.Task{LlamaLogic.TuningArchive.TuningArchiveCaptureResult}
    content.vb: Public Function CaptureAsync(installation As GameInstallation, options As TuningArchiveCaptureOptions = Nothing, progress As IProgress(Of TuningArchiveProgress) = Nothing, cancellationToken As CancellationToken = Nothing) As Task(Of TuningArchiveCaptureResult)
