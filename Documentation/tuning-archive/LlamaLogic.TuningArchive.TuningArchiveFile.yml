  assemblies:
  - LlamaLogic.TuningArchive
  namespace: LlamaLogic.TuningArchive
  summary: "Captures a snapshot of the tuning, SimData, animation state machines, strings and media of the specified <code class=\"paramref\">installation</code> (\U0001F4A4)"
  remarks: >-
    Media are the images, sounds and videos to which the captured tuning and SimData refer (with the audio the sounds use), taken from the client packages of the packs with the same rules as tuning; which kinds are captured is up to the <code class="paramref">options</code>.

    Strings are merged from every string table of every pack the way the game merges them: a string in a package of higher priority replaces the same string in a package of lower priority (packages of the same priority in pack order, the base game first), so a pack's <code>Delta</code> strings add to and correct its installed strings rather than replacing them.

    Within a pack, tuning, SimData and animation state machines are taken from the pack's <code>Delta</code> packages before its installed packages, because the <code>Delta</code> folder patches the installed one: its resources replace theirs and its delete records retire theirs, whatever priorities the two folders' configurations assign.

    The game does not load the patches of packs that are not installed, so their tuning is not captured; only the names of the tunings they patch are recorded (see <xref href="LlamaLogic.TuningArchive.TuningArchiveFile.GetUninstalledTunings(LlamaLogic.TuningArchive.TuningArchiveSnapshot)" data-throw-if-not-resolved="false"></xref>), so that what refers to them can still be explained.
  example: []
  syntax:
    content: public Task<TuningArchiveCaptureResult> CaptureAsync(GameInstallation installation, TuningArchiveCaptureOptions? options = null, IProgress<TuningArchiveProgress>? progress = null, CancellationToken cancellationToken = default)
