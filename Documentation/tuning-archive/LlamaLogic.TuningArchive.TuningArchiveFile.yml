  assemblies:
  - LlamaLogic.TuningArchive
  namespace: LlamaLogic.TuningArchive
  summary: "Imports a folder of tuning files extracted by another tool (such as Scumbumbo's XML Extractor or Sims 4 Studio) as a snapshot of the specified <code class=\"paramref\">gameVersion</code> (\U0001F4A4)"
  remarks: >-
    <p>

    Every <code>.xml</code> file under the folder whose root is an instance (<code>I</code>) or module (<code>M</code>) tuning element is imported as tuning, every one whose root is <code>SimData</code> as SimData, and every other one whose file name has a resource key of type <xref href="LlamaLogic.Packages.ResourceType.AnimationStateMachine" data-throw-if-not-resolved="false"></xref> (as Scumbumbo's XML Extractor names the files in its <code>AsmJazz</code> folders) as an animation state machine.

    A tuning's type is derived from its <code>i</code> attribute the way the game derives it, falling back to a resource key in its file name, and its group is always 0 (the game identifies tuning by type and instance); comments are discarded.

    A file is attributed to the pack named by a folder in its path (such as <code>EP01</code>), or to <xref href="LlamaLogic.TuningArchive.TuningArchiveImportOptions.DefaultPack" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    A file named <code>Reference - All Strings.txt</code> in the folder, as Scumbumbo's XML Extractor writes it, is imported as the snapshot's strings.

    </p>
  example: []
  syntax:
    content: public Task<TuningArchiveCaptureResult> ImportFolderAsync(string folder, string gameVersion, TuningArchiveImportOptions? options = null, IProgress<TuningArchiveProgress>? progress = null, CancellationToken cancellationToken = default)
