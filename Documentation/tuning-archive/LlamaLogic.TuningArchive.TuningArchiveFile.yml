  assemblies:
  - LlamaLogic.TuningArchive
  namespace: LlamaLogic.TuningArchive
  summary: "Represents an archive of The Sims 4's tuning across versions of the game, stored in a SQLite database file (\U0001F512)"
  remarks: >-
    <p>

    Each <xref href="LlamaLogic.TuningArchive.TuningArchiveSnapshot" data-throw-if-not-resolved="false"></xref> records the tuning, SimData and strings of a version of the game, as captured from an installation or imported from extracted files.

    Content is stored once however many snapshots contain it, and each resource's history is kept as ranges of snapshots, so a snapshot adds only what changed.

    </p>

    <p>

    An archive's members are safe to use from multiple threads. Operations that change the archive are serialized.

    </p>

    <p>

    An application that only reads an archive another application maintains should open it with <xref href="LlamaLogic.TuningArchive.TuningArchiveFile.OpenReadOnly(System.String)" data-throw-if-not-resolved="false"></xref>, which never changes the file, rather than <xref href="LlamaLogic.TuningArchive.TuningArchiveFile.Open(System.String)" data-throw-if-not-resolved="false"></xref>, which upgrades the file to this library's version.

    </p>
  example: []
  syntax:
    content: 'public sealed class TuningArchiveFile : IDisposable'
    content.vb: Public NotInheritable Class TuningArchiveFile Implements IDisposable
