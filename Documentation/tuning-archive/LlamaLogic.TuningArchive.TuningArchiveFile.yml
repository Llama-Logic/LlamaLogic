  fullName: LlamaLogic.TuningArchive.TuningArchiveFile.ExportAsync(LlamaLogic.TuningArchive.TuningArchiveSnapshot, string, LlamaLogic.TuningArchive.TuningArchiveExportOptions?, System.IProgress<LlamaLogic.TuningArchive.TuningArchiveProgress>?, System.Threading.CancellationToken)
  type: Method
  source:
    remote:
      path: LlamaLogic.TuningArchive/TuningArchiveFile.Export.cs
      branch: main
      repo: https://github.com/Llama-Logic/LlamaLogic.git
    id: ExportAsync
    path: ../LlamaLogic.TuningArchive/TuningArchiveFile.Export.cs
    startLine: 348
  assemblies:
  - LlamaLogic.TuningArchive
  namespace: LlamaLogic.TuningArchive
  summary: "Exports the tuning of the specified <code class=\"paramref\">snapshot</code> (and, optionally, its animation state machines and SimData) as files in the specified <code class=\"paramref\">folder</code>, laid out and named the way Scumbumbo's XML Extractor extracts the game's tuning (\U0001F4A4)"
  remarks: >-
    <p>

    Each resource is written to a folder for its pack (such as <code>EP01</code>) and, in it, a folder for its tuning type (such as <code>buff</code>) or <code>AsmJazz</code>, as indented UTF-8 XML with a byte order mark and CRLF line endings.

    SimData is written beside the tuning with its instance, so that both can be chosen together for Sims 4 Studio's batch import, or to a <code>SimData</code> folder in its pack's folder if there is no such tuning.

    The group in file names is the pack's identifier, as XML Extractor writes it: taken from the snapshot's game scripts when it has them, otherwise from the pack stamp of the pack's SimData, otherwise from XML Extractor's own table of packs.

    </p>

    <p>

    A tuning that more than one pack contains is written once, to the folder of the pack the snapshot attributes it to; XML Extractor writes it to the folder of each pack.

    The archive does not keep the order of the attributes the game ships, so elements' attributes are in canonical order (see <xref href="LlamaLogic.TuningArchive.TuningXml" data-throw-if-not-resolved="false"></xref>), with the <code>n</code> and <code>t</code> attributes ordered as <xref href="LlamaLogic.TuningArchive.TuningArchiveExportOptions.AttributeOrder" data-throw-if-not-resolved="false"></xref> specifies.

    References to tuning of packs that were not installed are commented with the names the packs' patches give it, as XML Extractor comments them (see <xref href="LlamaLogic.TuningArchive.TuningArchiveFile.GetUninstalledTunings(LlamaLogic.TuningArchive.TuningArchiveSnapshot)" data-throw-if-not-resolved="false"></xref>), and those names are in the reference files, but the tuning itself is not exported.

    </p>
  example: []
  syntax:
    content: public Task<TuningArchiveExportResult> ExportAsync(TuningArchiveSnapshot snapshot, string folder, TuningArchiveExportOptions? options = null, IProgress<TuningArchiveProgress>? progress = null, CancellationToken cancellationToken = default)
    parameters:
    - id: snapshot
      type: LlamaLogic.TuningArchive.TuningArchiveSnapshot
    - id: folder
      type: System.String
    - id: options
      type: LlamaLogic.TuningArchive.TuningArchiveExportOptions
    - id: progress
      type: System.IProgress{LlamaLogic.TuningArchive.TuningArchiveProgress}
    - id: cancellationToken
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task{LlamaLogic.TuningArchive.TuningArchiveExportResult}
    content.vb: Public Function ExportAsync(snapshot As TuningArchiveSnapshot, folder As String, options As TuningArchiveExportOptions = Nothing, progress As IProgress(Of TuningArchiveProgress) = Nothing, cancellationToken As CancellationToken = Nothing) As Task(Of TuningArchiveExportResult)
