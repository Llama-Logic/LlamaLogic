  assemblies:
  - LlamaLogic.TuningArchive
  namespace: LlamaLogic.TuningArchive
  summary: Provides the canonical text form in which a tuning archive stores tuning and SimData documents
  remarks: >-
    The canonical form is UTF-8 without a byte order mark, an XML declaration, two-space indentation and line feeds, with comments removed.

    The root element's attributes are in ordinal order (<code>c</code>, <code>i</code>, <code>m</code>, <code>n</code>, <code>s</code>), and every other element's are <code>n</code>, then <code>t</code>, then the rest in ordinal order.

    Documents with the same content therefore have the same canonical text however they were obtained (from the game's combined tuning or from files extracted by another tool).
  example: []
  syntax:
    content: public static class TuningXml
    content.vb: Public Module TuningXml
