  assemblies:
  - LlamaLogic.Packages
  namespace: LlamaLogic.Packages.Formats
  summary: "Represents a record bundle: a set of records, each a <xref href=\"LlamaLogic.Packages.ResourceKey\" data-throw-if-not-resolved=\"false\"></xref> and its content, in the <code>LDNB</code> container format (\U0001F513)"
  remarks: >-
    The game stores lot architecture in this container, as the content of a <xref href="LlamaLogic.Packages.ResourceType.WorldLotArchitecture" data-throw-if-not-resolved="false"></xref> resource in world files, of the architecture data of a lot in a save game, and of the architecture of a tray blueprint.

    Each lot architecture section is one record, keyed by the section's type, group zero and a fixed instance.

    <xref href="LlamaLogic.Packages.Formats.RecordBundle.Encode" data-throw-if-not-resolved="false"></xref> lays the bundle out the way Maxis does: records grouped by type and group in ascending order, keeping their order within a group, so decoding and encoding a bundle Maxis wrote reproduces it byte for byte.
  example: []
  syntax:
    content: public sealed class RecordBundle
    content.vb: Public NotInheritable Class RecordBundle
