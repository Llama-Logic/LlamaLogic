  assemblies:
  - LlamaLogic.Packages
  namespace: LlamaLogic.Packages.Models.CombinedTuning
  summary: "Represents a <xref href=\"LlamaLogic.Packages.ResourceType.CombinedTuning\" data-throw-if-not-resolved=\"false\"></xref> resource (\U0001F513)"
  remarks: >-
    Maxis ships the game's tuning merged into resources of this type, encoded either as a binary packed XML document (a <code>DATA</code> file) or as XML text.

    <xref href="LlamaLogic.Packages.Models.CombinedTuning.CombinedTuningModel.Decode(System.ReadOnlyMemory%7bSystem.Byte%7d)" data-throw-if-not-resolved="false"></xref> accepts both and presents the merged document as <xref href="LlamaLogic.Packages.Models.CombinedTuning.CombinedTuningModel.Document" data-throw-if-not-resolved="false"></xref>.

    <xref href="LlamaLogic.Packages.Models.CombinedTuning.CombinedTuningModel.Encode" data-throw-if-not-resolved="false"></xref> always produces XML text, written the way Maxis writes it.

    <xref href="LlamaLogic.Packages.Models.CombinedTuning.CombinedTuningModel.GetTunings" data-throw-if-not-resolved="false"></xref> produces the individual tuning documents the merged document contains.
  example: []
  syntax:
    content: 'public sealed class CombinedTuningModel : Model, IModel<CombinedTuningModel>, IModel'
    content.vb: Public NotInheritable Class CombinedTuningModel Inherits Model Implements IModel(Of CombinedTuningModel), IModel
