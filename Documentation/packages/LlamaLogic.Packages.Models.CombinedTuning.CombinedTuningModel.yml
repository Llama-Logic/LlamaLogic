  assemblies:
  - LlamaLogic.Packages
  namespace: LlamaLogic.Packages.Models.CombinedTuning
  summary: "Gets the individual tuning documents in <xref href=\"LlamaLogic.Packages.Models.CombinedTuning.CombinedTuningModel.Document\" data-throw-if-not-resolved=\"false\"></xref>, in document order, with each reference to a shared node (<code>&lt;r x=\"…\"&gt;</code>) replaced by a copy of that node (\U0001F4A4)"
  remarks: >-
    The documents are produced as the sequence is enumerated, and are independent of <xref href="LlamaLogic.Packages.Models.CombinedTuning.CombinedTuningModel.Document" data-throw-if-not-resolved="false"></xref> and of each other.

    Modifying <xref href="LlamaLogic.Packages.Models.CombinedTuning.CombinedTuningModel.Document" data-throw-if-not-resolved="false"></xref> while enumerating has undefined results.
  example: []
  syntax:
