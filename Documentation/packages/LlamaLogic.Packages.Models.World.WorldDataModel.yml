  assemblies:
  - LlamaLogic.Packages
  namespace: LlamaLogic.Packages.Models.World
  summary: "Represents a <xref href=\"LlamaLogic.Packages.ResourceType.WorldData\" data-throw-if-not-resolved=\"false\"></xref> resource: the placement of a world's lots and the objects of the world outside them (\U0001F513)"
  remarks: >-
    A world file is a package (see <xref href="LlamaLogic.Packages.DataBasePackedFile" data-throw-if-not-resolved="false"></xref>); this models one of the resources in it, not the file.

    The resource is a tree of tagged chunks (<code>OMGS</code>, holding <code>OMGR</code> object managers, holding <code>ID</code>, <code>LOT</code> and <code>OBJ</code> chunks).

    <xref href="LlamaLogic.Packages.Models.World.WorldDataModel.Decode(System.ReadOnlyMemory%7bSystem.Byte%7d)" data-throw-if-not-resolved="false"></xref> supports the chunks the game's world files contain and rejects the others the game can also read (<code>MODL</code>, <code>DEFG</code>, <code>LEVL</code>, <code>SCRP</code>, <code>TRES</code>, <code>REFS</code>, <code>SIZY</code>), whose layouts are not established.

    <xref href="LlamaLogic.Packages.Models.World.WorldDataModel.Encode" data-throw-if-not-resolved="false"></xref> writes the chunks in the order the game's world files do, so decoding and encoding one of them reproduces it byte for byte.

    Older world files lack the <code>SNOW</code> and <code>OPRP</code> chunks of objects; the corresponding properties are then <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> and are not written.

    The game names the resource after its world file; see <xref href="LlamaLogic.Packages.Models.World.WorldDataModel.GetKey(System.String)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public sealed class WorldDataModel : Model, IModel<WorldDataModel>, IModel'
    content.vb: Public NotInheritable Class WorldDataModel Inherits Model Implements IModel(Of WorldDataModel), IModel
