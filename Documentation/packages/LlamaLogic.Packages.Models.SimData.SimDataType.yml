    id: TABLESETREFERENCE
    path: ../LlamaLogic.Packages/Models/SimData/SimDataType.cs
    startLine: 109
  assemblies:
  - LlamaLogic.Packages
  namespace: LlamaLogic.Packages.Models.SimData
  summary: >-
    <p>It's not just about good manners from "How to Serve and Not Be Served", it's really about this <xref href="System.UInt64" data-throw-if-not-resolved="false"></xref></p>

    <p>

    Seriously, though, why have these when we already have <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.UINT64" data-throw-if-not-resolved="false"></xref>, you ask?

    <blockquote>

    you’re right that table set refs are just uint64s, but it is important to distinguish them because they mean different things.

    int64s are just literal numbers, table set refs are tuning IDs.

    so, when the game loads these, it knows that uint64 is just a number, so leave it alone, whereas a table set ref is tuning, so it needs to look that tuning up and use it as the value there rather than the number itself

    </blockquote>

    — frankk, August 16, 2024 in Lot 51's Discord

    </p>
  example: []
  syntax:
    content: TABLESETREFERENCE = 18
    return:
      type: LlamaLogic.Packages.Models.SimData.SimDataType
