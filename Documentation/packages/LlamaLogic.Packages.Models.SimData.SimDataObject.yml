  namespace: LlamaLogic.Packages.Models.SimData
  summary: "Represents an object in a <xref href=\"LlamaLogic.Packages.ResourceType.SimData\" data-throw-if-not-resolved=\"false\"></xref> resource: a row of values described by a <xref href=\"LlamaLogic.Packages.Models.SimData.SimDataSchema\" data-throw-if-not-resolved=\"false\"></xref> (\U0001F513)"
  remarks: >-
    Each value's .NET type is determined by its column's <xref href="LlamaLogic.Packages.Models.SimData.SimDataType" data-throw-if-not-resolved="false"></xref>:

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.BOOL" data-throw-if-not-resolved="false"></xref> is <xref href="System.Boolean" data-throw-if-not-resolved="false"></xref>;

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.CHAR8" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.UINT8" data-throw-if-not-resolved="false"></xref> are <xref href="System.Byte" data-throw-if-not-resolved="false"></xref>;

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.INT8" data-throw-if-not-resolved="false"></xref> is <xref href="System.SByte" data-throw-if-not-resolved="false"></xref>;

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.INT16" data-throw-if-not-resolved="false"></xref> is <xref href="System.Int16" data-throw-if-not-resolved="false"></xref>;

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.UINT16" data-throw-if-not-resolved="false"></xref> is <xref href="System.UInt16" data-throw-if-not-resolved="false"></xref>;

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.INT32" data-throw-if-not-resolved="false"></xref> is <xref href="System.Int32" data-throw-if-not-resolved="false"></xref>;

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.UINT32" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.LOCKEY" data-throw-if-not-resolved="false"></xref> are <xref href="System.UInt32" data-throw-if-not-resolved="false"></xref>;

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.INT64" data-throw-if-not-resolved="false"></xref> is <xref href="System.Int64" data-throw-if-not-resolved="false"></xref>;

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.UINT64" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.TABLESETREFERENCE" data-throw-if-not-resolved="false"></xref> are <xref href="System.UInt64" data-throw-if-not-resolved="false"></xref>;

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.FLOAT" data-throw-if-not-resolved="false"></xref> is <xref href="System.Single" data-throw-if-not-resolved="false"></xref>;

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.FLOAT2" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.FLOAT3" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.FLOAT4" data-throw-if-not-resolved="false"></xref> are <xref href="System.Numerics.Vector2" data-throw-if-not-resolved="false"></xref>, <xref href="System.Numerics.Vector3" data-throw-if-not-resolved="false"></xref> and <xref href="System.Numerics.Vector4" data-throw-if-not-resolved="false"></xref>;

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.RESOURCEKEY" data-throw-if-not-resolved="false"></xref> is <xref href="LlamaLogic.Packages.ResourceKey" data-throw-if-not-resolved="false"></xref>;

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.STRING8" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.HASHEDSTRING8" data-throw-if-not-resolved="false"></xref> are <xref href="System.String" data-throw-if-not-resolved="false"></xref> (or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>; the hash of a <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.HASHEDSTRING8" data-throw-if-not-resolved="false"></xref> is computed when encoding);

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.OBJECT" data-throw-if-not-resolved="false"></xref> is <xref href="LlamaLogic.Packages.Models.SimData.SimDataObject" data-throw-if-not-resolved="false"></xref>, <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.VECTOR" data-throw-if-not-resolved="false"></xref> is <xref href="LlamaLogic.Packages.Models.SimData.SimDataVector" data-throw-if-not-resolved="false"></xref>, and <xref href="LlamaLogic.Packages.Models.SimData.SimDataType.VARIANT" data-throw-if-not-resolved="false"></xref> is <xref href="LlamaLogic.Packages.Models.SimData.SimDataVariant" data-throw-if-not-resolved="false"></xref> (each or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>).
