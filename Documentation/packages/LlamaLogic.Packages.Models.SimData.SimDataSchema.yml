  summary: "Represents the schema of a <xref href=\"LlamaLogic.Packages.Models.SimData.SimDataObject\" data-throw-if-not-resolved=\"false\"></xref> (\U0001F512)"
  remarks: >-
    The order of <xref href="LlamaLogic.Packages.Models.SimData.SimDataSchema.Columns" data-throw-if-not-resolved="false"></xref> is the order in which the columns' values are laid out in each row.

    For schemas the game reads with a fixed layout (e.g. <code>Client_*</code> and <code>Renderer.*</code> schemas), this order must match the game's, which is why <xref href="LlamaLogic.Packages.Models.SimData.SimDataModel.Decode(System.ReadOnlyMemory%7bSystem.Byte%7d)" data-throw-if-not-resolved="false"></xref> preserves it.
