  summary: "Represents a <xref href=\"LlamaLogic.Packages.ResourceType.AnimationStateMachine\" data-throw-if-not-resolved=\"false\"></xref> resource (\U0001F513)"
  remarks: >-
    Maxis ships animation state machines (which creators also know as ASMs or JAZZ) encoded either as a binary packed XML document (a <code>DATA</code> file) or as XML text.

    <xref href="LlamaLogic.Packages.Models.AnimationStateMachine.AnimationStateMachineModel.Decode(System.ReadOnlyMemory%7bSystem.Byte%7d)" data-throw-if-not-resolved="false"></xref> accepts both and presents the state machine as <xref href="LlamaLogic.Packages.Models.AnimationStateMachine.AnimationStateMachineModel.Document" data-throw-if-not-resolved="false"></xref>.

    <xref href="LlamaLogic.Packages.Models.AnimationStateMachine.AnimationStateMachineModel.Encode" data-throw-if-not-resolved="false"></xref> always produces XML text, written the way Maxis writes it.
