  assemblies:
  - LlamaLogic.Packages
  namespace: LlamaLogic.Packages.Formats
  summary: Makes a sound for The Sims 4 from an MP3, without re-encoding it
  remarks: >-
    The sound's length comes from the MP3's gapless playback tag (as LAME and the tools built on it write); an MP3 without one is taken to end where its last frame does.

    The game's sounds begin with 47 samples stored uncompressed, which this writes as silence, so the first millisecond of the MP3 is not heard.
  example: []
  syntax:
    content: public static ElectronicArtsAudioCoreSound CreateFromMp3(ReadOnlyMemory<byte> mp3Data, ElectronicArtsAudioCoreStorage storage, bool isLooping = false)
    parameters:
    - id: mp3Data
      type: System.ReadOnlyMemory{System.Byte}
      description: 'The MP3: MPEG-1 Layer III (32,000, 44,100 or 48,000 Hz), mono or stereo, constant or variable bitrate (not free format)'
    - id: storage
      type: LlamaLogic.Packages.Formats.ElectronicArtsAudioCoreStorage
      description: 'Where the game should find the audio: <xref href="LlamaLogic.Packages.Formats.ElectronicArtsAudioCoreStorage.Memory" data-throw-if-not-resolved="false"></xref> (in the <xref href="LlamaLogic.Packages.ResourceType.AudioVocals" data-throw-if-not-resolved="false"></xref> resource) or <xref href="LlamaLogic.Packages.Formats.ElectronicArtsAudioCoreStorage.Stream" data-throw-if-not-resolved="false"></xref> (in an <xref href="LlamaLogic.Packages.ResourceType.AudioEffects" data-throw-if-not-resolved="false"></xref> resource with the same instance)'
    - id: isLooping
      type: System.Boolean
      description: Whether the sound loops from its start
    return:
      type: LlamaLogic.Packages.Formats.ElectronicArtsAudioCoreSound
    content.vb: Public Shared Function CreateFromMp3(mp3Data As ReadOnlyMemory(Of Byte), storage As ElectronicArtsAudioCoreStorage, isLooping As Boolean = False) As ElectronicArtsAudioCoreSound
  overload: LlamaLogic.Packages.Formats.ElectronicArtsAudioCore.CreateFromMp3*
  exceptions:
  - type: System.IO.InvalidDataException
    commentId: T:System.IO.InvalidDataException
    description: The MP3 is malformed, or its tag declares an encoder delay of less than 576 samples
  - type: System.NotSupportedException
    commentId: T:System.NotSupportedException
    description: The MP3 is not MPEG-1 Layer III (32,000, 44,100 or 48,000 Hz), or is free format
  nameWithType.vb: ElectronicArtsAudioCore.CreateFromMp3(ReadOnlyMemory(Of Byte), ElectronicArtsAudioCoreStorage, Boolean)
  fullName.vb: LlamaLogic.Packages.Formats.ElectronicArtsAudioCore.CreateFromMp3(System.ReadOnlyMemory(Of Byte), LlamaLogic.Packages.Formats.ElectronicArtsAudioCoreStorage, Boolean)
  name.vb: CreateFromMp3(ReadOnlyMemory(Of Byte), ElectronicArtsAudioCoreStorage, Boolean)
