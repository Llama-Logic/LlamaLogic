  assemblies:
  - LlamaLogic.Packages
  namespace: LlamaLogic.Packages.Formats
  summary: "Provides methods for dealing with sounds in Electronic Arts' AudioCore format: the <xref href=\"LlamaLogic.Packages.ResourceType.AudioVocals\" data-throw-if-not-resolved=\"false\"></xref> resources of The Sims 4 (a header, followed by its audio if the sound is held in memory) and their <xref href=\"LlamaLogic.Packages.ResourceType.AudioEffects\" data-throw-if-not-resolved=\"false\"></xref> bodies (the audio of a streamed sound)"
  remarks: The rebuilding of EALayer3 into MP3 is adapted from vgmstream (see <code>Formats/Vgmstream/license.txt</code>); unlike vgmstream, it lays the audio out at a constant bitrate with a bit reservoir and adds a gapless playback tag, so that ordinary MP3 decoders play it sample for sample as the game does
