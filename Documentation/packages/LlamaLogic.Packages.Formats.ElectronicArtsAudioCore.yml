  assemblies:
  - LlamaLogic.Packages
  namespace: LlamaLogic.Packages.Formats
  summary: Makes a sound for The Sims 4 from MP3s, without re-encoding them
  example: []
  syntax:
    content: public static ElectronicArtsAudioCoreSound CreateFromMp3(IReadOnlyList<IReadOnlyList<ReadOnlyMemory<byte>>> segments, ElectronicArtsAudioCoreStorage storage, bool isLooping)
    parameters:
    - id: segments
      type: System.Collections.Generic.IReadOnlyList{System.Collections.Generic.IReadOnlyList{System.ReadOnlyMemory{System.Byte}}}
      description: "The MP3s of the sound: one segment, or, for a sound that loops from somewhere other than its start, the part before the loop and the loop; each segment's MP3s are layers played together (all stereo, except that the last may be mono), with the same number of frames"
    - id: storage
      type: LlamaLogic.Packages.Formats.ElectronicArtsAudioCoreStorage
      description: Where the game should find the audio
    - id: isLooping
      type: System.Boolean
      description: Whether the sound loops (from its start, with one segment; from the start of the second segment, with two)
    return:
      type: LlamaLogic.Packages.Formats.ElectronicArtsAudioCoreSound
    content.vb: Public Shared Function CreateFromMp3(segments As IReadOnlyList(Of IReadOnlyList(Of ReadOnlyMemory(Of Byte))), storage As ElectronicArtsAudioCoreStorage, isLooping As Boolean) As ElectronicArtsAudioCoreSound
  overload: LlamaLogic.Packages.Formats.ElectronicArtsAudioCore.CreateFromMp3*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: <code class="paramref">segments</code> is empty, has more than two segments, has two without <code class="paramref">isLooping</code>, or has a segment without MP3s
  - type: System.IO.InvalidDataException
    commentId: T:System.IO.InvalidDataException
    description: An MP3 is malformed, the MP3s disagree about their sample rate, layout or length, or the sound is too long for <code class="paramref">storage</code>
  - type: System.NotSupportedException
    commentId: T:System.NotSupportedException
    description: An MP3 is not MPEG-1 Layer III (32,000, 44,100 or 48,000 Hz), or <code class="paramref">storage</code> is <xref href="LlamaLogic.Packages.Formats.ElectronicArtsAudioCoreStorage.Gigasample" data-throw-if-not-resolved="false"></xref>
  nameWithType.vb: ElectronicArtsAudioCore.CreateFromMp3(IReadOnlyList(Of IReadOnlyList(Of ReadOnlyMemory(Of Byte))), ElectronicArtsAudioCoreStorage, Boolean)
  fullName.vb: LlamaLogic.Packages.Formats.ElectronicArtsAudioCore.CreateFromMp3(System.Collections.Generic.IReadOnlyList(Of System.Collections.Generic.IReadOnlyList(Of System.ReadOnlyMemory(Of Byte))), LlamaLogic.Packages.Formats.ElectronicArtsAudioCoreStorage, Boolean)
  name.vb: CreateFromMp3(IReadOnlyList(Of IReadOnlyList(Of ReadOnlyMemory(Of Byte))), ElectronicArtsAudioCoreStorage, Boolean)
