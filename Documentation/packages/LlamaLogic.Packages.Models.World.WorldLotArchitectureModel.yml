  namespace: LlamaLogic.Packages.Models.World
  summary: "Represents a <xref href=\"LlamaLogic.Packages.ResourceType.WorldLotArchitecture\" data-throw-if-not-resolved=\"false\"></xref> resource: the architecture of a lot template in a world file, as a <xref href=\"LlamaLogic.Packages.Formats.RecordBundle\" data-throw-if-not-resolved=\"false\"></xref> (\U0001F513)"
  remarks: >-
    A world file is a package (see <xref href="LlamaLogic.Packages.DataBasePackedFile" data-throw-if-not-resolved="false"></xref>); this models one of the resources in it, not the file.

    The game names the resource after the lot template it belongs to; see <xref href="LlamaLogic.Packages.Models.World.WorldLotArchitectureModel.GetKey(System.UInt32)" data-throw-if-not-resolved="false"></xref>.
