  assemblies:
  - LlamaLogic.Packages
  namespace: LlamaLogic.Packages.Models.World
  summary: Gets the key of the <xref href="LlamaLogic.Packages.ResourceType.WorldLotArchitecture" data-throw-if-not-resolved="false"></xref> resource of the lot template with the specified <code class="paramref">lotTemplateId</code>
  remarks: >-
    The game derives the key from a file name: the instance is the FNV-1 64-bit hash of <code>1-</code> followed by the lot template id in eight lowercase hexadecimal digits, and the type is the FNV-1 32-bit hash of the extension <code>dat</code>.

    The <xref href="LlamaLogic.Packages.ResourceType.WorldLotObjects" data-throw-if-not-resolved="false"></xref> resource of the same lot template has the same instance.
  example: []
  syntax:
    content: public static ResourceKey GetKey(uint lotTemplateId)
