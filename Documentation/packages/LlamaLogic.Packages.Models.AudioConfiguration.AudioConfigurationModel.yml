  assemblies:
  - LlamaLogic.Packages
  namespace: LlamaLogic.Packages.Models.AudioConfiguration
  summary: "Represents a <xref href=\"LlamaLogic.Packages.ResourceType.AudioConfiguration\" data-throw-if-not-resolved=\"false\"></xref> resource (a PROPX): the audio a sound plays and how the game plays it (\U0001F513)"
  remarks: >-
    Tuning refers to a configuration with a key of type <xref href="LlamaLogic.Packages.ResourceType.AudioConfigurationReference" data-throw-if-not-resolved="false"></xref> and the configuration's instance.

    A configuration's <xref href="LlamaLogic.Packages.Models.AudioConfiguration.AudioConfigurationModel.Samples" data-throw-if-not-resolved="false"></xref> are the instances of <xref href="LlamaLogic.Packages.ResourceType.AudioVocals" data-throw-if-not-resolved="false"></xref> resources (with their <xref href="LlamaLogic.Packages.ResourceType.AudioEffects" data-throw-if-not-resolved="false"></xref> bodies, if streamed), and nearly all of the game's configurations have a <xref href="LlamaLogic.Packages.Models.AudioConfiguration.AudioConfigurationModel.Parent" data-throw-if-not-resolved="false"></xref>.

    Versions 1 through 7 are supported; version 3 is that of nearly all of the game's configurations.

    Adapted from S4S by Andrew, extended to read the list version 3 added, which S4S does not.
