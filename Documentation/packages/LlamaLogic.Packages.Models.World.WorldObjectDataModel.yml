  assemblies:
  - LlamaLogic.Packages
  namespace: LlamaLogic.Packages.Models.World
  summary: "Represents a <xref href=\"LlamaLogic.Packages.ResourceType.WorldObjectData\" data-throw-if-not-resolved=\"false\"></xref> resource: the objects, routing footprints and locators of a world's lots (\U0001F513)"
  remarks: >-
    A world file is a package (see <xref href="LlamaLogic.Packages.DataBasePackedFile" data-throw-if-not-resolved="false"></xref>); this models one of the resources in it, not the file.

    Versions 7 through 10 are supported: 10 is the version of every world file the game currently ships, and 7 that of older ones.

    Version 8 added each object's <xref href="LlamaLogic.Packages.Models.World.WorldObjectDataObject.Snow" data-throw-if-not-resolved="false"></xref> flag, version 9 each lot's <xref href="LlamaLogic.Packages.Models.World.WorldObjectDataLot.StairLocators" data-throw-if-not-resolved="false"></xref> and version 10 each object's <xref href="LlamaLogic.Packages.Models.World.WorldObjectDataObject.Flags" data-throw-if-not-resolved="false"></xref>.
  example: []
