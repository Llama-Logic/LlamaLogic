  assemblies:
  - LlamaLogic.Packages
  namespace: LlamaLogic.Packages.Models.SimData
  summary: "Represents a <xref href=\"LlamaLogic.Packages.ResourceType.SimData\" data-throw-if-not-resolved=\"false\"></xref> resource (\U0001F513)"
  remarks: >-
    A SimData resource is a set of named <xref href="LlamaLogic.Packages.Models.SimData.SimDataModel.Instances" data-throw-if-not-resolved="false"></xref>, each an object described by a <xref href="LlamaLogic.Packages.Models.SimData.SimDataSchema" data-throw-if-not-resolved="false"></xref> whose values may refer to further objects, strings, vectors and variants.

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataModel.Decode(System.ReadOnlyMemory%7bSystem.Byte%7d)" data-throw-if-not-resolved="false"></xref> reads any well-formed layout, including those written by community tools, and reads a reference whose offset is zero (which could only refer to itself, and which some community tools write) as <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.

    It rejects a resource in which a row is referred to more than once, which Maxis never writes and which the model, being a tree, cannot represent.

    <xref href="LlamaLogic.Packages.Models.SimData.SimDataModel.Encode" data-throw-if-not-resolved="false"></xref> always lays the resource out the way Maxis does, so decoding and encoding a resource Maxis wrote reproduces it byte for byte.
