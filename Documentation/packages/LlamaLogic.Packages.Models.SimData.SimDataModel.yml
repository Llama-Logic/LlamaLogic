  assemblies:
  - LlamaLogic.Packages
  namespace: LlamaLogic.Packages.Models.SimData
  summary: Gets the XML representation of the resource that Sims 4 Studio exports and imports
  remarks: >-
    A <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> string is written as an empty element (<code>&lt;T name="..." /&gt;</code>) and an empty string as an element with empty content (<code>&lt;T name="..."&gt;&lt;/T&gt;</code>), which <xref href="LlamaLogic.Packages.Models.SimData.SimDataModel.FromXml(System.Xml.Linq.XDocument)" data-throw-if-not-resolved="false"></xref> tells apart (Sims 4 Studio reads both as empty strings).

    An empty vector is written the same way as a <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> one, which <xref href="LlamaLogic.Packages.Models.SimData.SimDataModel.Encode" data-throw-if-not-resolved="false"></xref> also writes the same way.
  example: []
  syntax:
