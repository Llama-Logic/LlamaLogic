  remarks: >-
    Fields are matched to columns by exact name, and every column of an object must have exactly one field.

    A string field written as an empty element (<code>&lt;T name="..." /&gt;</code>) is read as <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.

    Type names written by Sims4Toolkit (<code>Int8</code> and <code>UInt8</code>) are accepted along with Sims 4 Studio's.

    A schema without a <code>schema_hash</code> attribute gets its <xref href="LlamaLogic.Packages.Models.SimData.SimDataSchema.ComputedHash" data-throw-if-not-resolved="false"></xref>.
