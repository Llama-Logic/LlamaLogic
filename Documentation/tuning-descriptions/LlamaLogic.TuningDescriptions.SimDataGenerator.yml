  assemblies:
  - LlamaLogic.TuningDescriptions
  namespace: LlamaLogic.TuningDescriptions
  summary: "Generates <xref href=\"LlamaLogic.Packages.ResourceType.SimData\" data-throw-if-not-resolved=\"false\"></xref> resources from tuning the way Maxis' build does, using the tuning descriptions of the game version for which they are generated (\U0001F512)"
  remarks: >-
    <p>Which tunables become columns, the columns' types, and the values written for tuning that omits a tunable all come from <xref href="LlamaLogic.TuningDescriptions.SimDataGenerator.Descriptions" data-throw-if-not-resolved="false"></xref>.</p>

    <p>Some of what Maxis' build knows is not in tuning descriptions, so the generator learns it:</p>

    <ul><li><xref href="LlamaLogic.TuningDescriptions.SimDataGenerator.AddTuning(System.Xml.Linq.XDocument)" data-throw-if-not-resolved="false"></xref> and <xref href="LlamaLogic.TuningDescriptions.SimDataGenerator.AddTuning(LlamaLogic.Packages.Models.CombinedTuning.CombinedTuningModel)" data-throw-if-not-resolved="false"></xref> learn the entries of dynamic enumerations (such as tags defined by module tuning) and the instances of tuning that is referenced by name</li><li><xref href="LlamaLogic.TuningDescriptions.SimDataGenerator.AddLayouts(LlamaLogic.Packages.Models.SimData.SimDataModel)" data-throw-if-not-resolved="false"></xref> learns the column order of schemas the game reads with a layout of its own (such as <code>Client_*</code> and <code>Renderer.*</code> schemas), whose columns are otherwise ordered by name</li></ul>

    <p>Maxis' build also converts some resource keys: a <xref href="LlamaLogic.Packages.ResourceType.PNGImage" data-throw-if-not-resolved="false"></xref> key in tuning is written to SimData as a <xref href="LlamaLogic.Packages.ResourceType.DSTImage" data-throw-if-not-resolved="false"></xref> key, and an <xref href="LlamaLogic.Packages.ResourceType.AudioConfigurationReference" data-throw-if-not-resolved="false"></xref> key as an <xref href="LlamaLogic.Packages.ResourceType.AudioConfiguration" data-throw-if-not-resolved="false"></xref> key in group <code>0x001407EC</code>. The generator does the same unless <xref href="LlamaLogic.TuningDescriptions.SimDataGenerator.RemoveResourceKeyConversion(LlamaLogic.Packages.ResourceType%2cSystem.UInt32)" data-throw-if-not-resolved="false"></xref> says otherwise, and <xref href="LlamaLogic.TuningDescriptions.SimDataGenerator.AddResourceKeyConversion(LlamaLogic.Packages.ResourceType%2cSystem.UInt32%2cLlamaLogic.Packages.ResourceType%2cSystem.UInt32)" data-throw-if-not-resolved="false"></xref> adds conversions.</p>

    <p>For the game's own SimData, the game's combined tuning and SimData are the sources of what the generator needs to learn.</p>
