  assemblies:
  - LlamaLogic.TuningDescriptions
  namespace: LlamaLogic.TuningDescriptions
  summary: "Represents a set of tuning descriptions for a version of The Sims 4, as Maxis distributes it (\U0001F512)"
  remarks: >-
    <p>

    A set is indexed by the paths of its documents when it is opened: instances are <code>*/Descriptions/{class}.tdesc</code>, modules are <code>Tuning/{module with . replaced by -}.tdesc</code>, and fragments are <code>TdescFrag/{class}.tdescfrag</code>.

    A document is read the first time it is requested, and it may be read again once nothing refers to it any longer, so requesting a document twice does not necessarily return the same object.

    </p>

    <p>

    A set's members are safe to use from multiple threads.

    </p>
  example: []
  syntax:
    content: 'public sealed class TuningDescriptionSet : IDisposable'
    content.vb: Public NotInheritable Class TuningDescriptionSet Implements IDisposable
