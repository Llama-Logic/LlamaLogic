    commentId: T:System.IO.InvalidDataException
    description: The class's inheritance cannot be resolved (see <xref href="LlamaLogic.TuningDescriptions.TuningDescriptionInstance.GetMethodResolutionOrder" data-throw-if-not-resolved="false"></xref>)
