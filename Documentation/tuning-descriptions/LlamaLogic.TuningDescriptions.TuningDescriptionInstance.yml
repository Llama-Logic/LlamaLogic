  assemblies:
  - LlamaLogic.TuningDescriptions
  namespace: LlamaLogic.TuningDescriptions
  summary: Gets the tunables of the class, including those it inherits and excluding those it deletes
  remarks: >-
    Each tunable is the description from the first class in <xref href="LlamaLogic.TuningDescriptions.TuningDescriptionInstance.GetMethodResolutionOrder" data-throw-if-not-resolved="false"></xref> that declares or deletes it, as in Python.

    The tunables are ordered by where they first appear, from the most basic class to this one.
  example: []
  syntax:
    content: public IReadOnlyList<TunableDescription> GetEffectiveMembers()
    return:
      type: System.Collections.Generic.IReadOnlyList{LlamaLogic.TuningDescriptions.TunableDescription}
    content.vb: Public Function GetEffectiveMembers() As IReadOnlyList(Of TunableDescription)
  overload: LlamaLogic.TuningDescriptions.TuningDescriptionInstance.GetEffectiveMembers*
  exceptions:
